<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le matin">
<meta name="theme-color" content="#141833">
<link rel="apple-touch-icon" href="icone.png">
<title>Le matin de Lou et Alba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* --u = unité d'échelle : s'adapte à la télé (16:9) comme à l'iPad (4:3) */
  :root { --c: #FF9F43; --nuit: #141833; --or: #FFD93D; --u: min(1vh, 0.75vw); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif;
    color: #fff; background: var(--nuit);
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; }

  #halo {
    position: fixed; left: -20vw; top: -30vh; width: 90vw; height: 120vh;
    border-radius: 50%; background: var(--c); opacity: .28; filter: blur(12vh);
    transition: background-color 1.5s;
  }

  /* ---------- Décor des saisons ---------- */
  #decor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; }
  .particule {
    position: absolute; top: -12vh; line-height: 1;
    animation: chute linear infinite; will-change: transform;
  }
  @keyframes chute {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    25%  { transform: translate3d(3vw, 30vh, 0) rotate(60deg); }
    50%  { transform: translate3d(-2vw, 62vh, 0) rotate(140deg); }
    75%  { transform: translate3d(3vw, 92vh, 0) rotate(220deg); }
    100% { transform: translate3d(0, 125vh, 0) rotate(300deg); }
  }

  .ecran {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    padding: calc(var(--u) * 5) 5vw; display: none; flex-direction: column;
  }
  .ecran.actif { display: flex; }

  /* ---------- Sundae ---------- */
  .miroir { display: inline-block; transform: scaleX(-1); }
  .sans-chat .miroir.mascotte { transform: none; }
  .mascotte svg.chat-svg { width: 1.3em; height: 1.05em; vertical-align: bottom; overflow: visible; }
  .chat-svg.marche .pa, .chat-svg.marche .pb { transform-box: fill-box; transform-origin: 50% 0; animation: patte .4s ease-in-out infinite alternate; }
  .chat-svg.marche .pb { animation-delay: -.4s; }
  @keyframes patte { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  .trot { display: inline-block; animation: trot .4s ease-in-out infinite alternate; }
  @keyframes trot { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(calc(var(--u) * -1.2)) rotate(3deg); } }
  .sundae-dodo { position: relative; display: inline-block; font-size: calc(var(--u) * 12); margin-top: calc(var(--u) * 3); }
  .sundae-dodo .corps { display: inline-block; animation: respire 3s ease-in-out infinite; transform-origin: bottom; }
  @keyframes respire { 50% { transform: scaleY(.92) scaleX(1.03); } }
  .zzz {
    position: absolute; right: calc(var(--u) * -5); top: calc(var(--u) * -4); font-size: calc(var(--u) * 5);
    animation: zzz 3s ease-in infinite; opacity: 0;
  }
  @keyframes zzz { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(var(--u) * 4), calc(var(--u) * -8)) scale(1.2); } }
  .sans-chat .sundae-dodo, .sans-chat .sundae-saut { display: none; }
  .sundae-saut {
    position: absolute; bottom: calc(var(--u) * 6); font-size: calc(var(--u) * 14);
    animation: saut .9s cubic-bezier(.3,0,.6,1) infinite;
  }
  .sundae-saut.gauche { left: 6vw; }
  .sundae-saut.droite { right: 6vw; animation-delay: .45s; }
  @keyframes saut { 0%, 100% { transform: translateY(0) scaleY(.9); } 45% { transform: translateY(calc(var(--u) * -14)) scaleY(1.05); } }

  /* ---------- Barre du haut ---------- */
  .barre { display: flex; justify-content: space-between; align-items: center; gap: 2vw; }
  .horloge { font-size: calc(var(--u) * 7); font-weight: 700; white-space: nowrap; }
  .bus {
    font-size: calc(var(--u) * 4); font-weight: 600; background: rgba(255,255,255,.12);
    padding: calc(var(--u) * 1) calc(var(--u) * 2.4); border-radius: 99px; white-space: nowrap;
  }
  .bus b { font-size: calc(var(--u) * 5); }
  .compteurs {
    display: flex; gap: calc(var(--u) * 1.5); border: none; background: none; color: inherit;
  }
  .compteur {
    font-size: calc(var(--u) * 3.5); font-weight: 600; white-space: nowrap;
    background: rgba(255,255,255,.1); border: calc(var(--u) * .45) solid var(--f);
    padding: calc(var(--u) * .6) calc(var(--u) * 1.8); border-radius: 99px;
  }
  .compteur .n { color: var(--or); font-weight: 700; }
  .compteur.bocal { --f: var(--or); }
  .compteur.bocal.pleine { animation: battement 1s ease-in-out infinite; background: rgba(255,217,61,.25); }

  /* ---------- Étape en cours : l'anneau au centre, Lou à gauche, Alba à droite ---------- */
  .scene {
    flex: 1; min-height: 0; position: relative; --t: 1;
    display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: 100%;
  }
  .scene.presse { --t: .55; }
  #sceneCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .centre, .cote { position: relative; min-height: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
  .anneau {
    position: relative; height: min(100%, calc(var(--u) * 58)); aspect-ratio: 1 / 1;
    container-type: size;
  }
  .anneau svg { width: 100%; height: 100%; }
  .anneau .fond { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.14); stroke-width: 16; }
  .anneau .reste {
    fill: none; stroke: var(--c); stroke-width: 16; stroke-linecap: round;
    transition: stroke-dashoffset .3s linear, stroke 1.5s;
  }
  .dans-anneau {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .emoji-centre { font-size: calc(var(--u) * 20); font-size: 36cqh; line-height: 1.05; }
  .restant { font-size: calc(var(--u) * 4.5); font-size: 8cqh; font-weight: 600; line-height: 1; white-space: nowrap; }
  .restant b { font-size: calc(var(--u) * 10); font-size: 18cqh; color: var(--c); font-weight: 700; }
  .anneau.urgent { animation: battement 1s ease-in-out infinite; }
  @keyframes battement { 50% { transform: scale(1.05); } }

  .texte { text-align: center; padding: calc(var(--u) * .5) 0 calc(var(--u) * 1); }
  .etape-num { font-size: calc(var(--u) * 3); opacity: .7; font-weight: 500; }
  .texte h1 { font-size: calc(var(--u) * 8); line-height: 1.05; margin: 0 0 calc(var(--u) * 1); }
  .details { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1.5); }
  .puce {
    font-size: calc(var(--u) * 3.8); font-weight: 600; background: rgba(255,255,255,.12);
    border: calc(var(--u) * .5) solid var(--c); padding: calc(var(--u) * .6) calc(var(--u) * 2.2); border-radius: 99px;
  }
  .puce.rappel { border-color: var(--or); background: rgba(255,217,61,.15); }
  .rappels-ligne { font-size: calc(var(--u) * 3.5); margin-top: calc(var(--u) * 1); color: var(--or); font-weight: 600; }
  .rappels-ligne:empty, .details:empty { display: none; }

  /* ---------- Avatars de Lou et Alba (animés par avatars.js) ---------- */
  .avatar { height: 100%; max-height: calc(var(--u) * 64); min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .avatar svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: calc(var(--u) * 58); aspect-ratio: 220 / 260; width: auto; overflow: visible; }
  .scene.fort .avatar svg { filter: drop-shadow(0 0 calc(var(--u) * 1.2) var(--c)); }
  .avatar .prenom {
    font-size: calc(var(--u) * 4.2); font-weight: 700; color: var(--f);
    background: rgba(20,24,51,.75); padding: 0 calc(var(--u) * 2); border-radius: 99px; margin-top: calc(var(--u) * -1);
  }
  .ok-btn {
    margin-top: calc(var(--u) * 1.5); font-size: calc(var(--u) * 3.6); font-weight: 700; color: #fff;
    background: rgba(255,255,255,.12); border: calc(var(--u) * .5) solid rgba(255,255,255,.35);
    border-radius: 99px; padding: calc(var(--u) * 1.2) calc(var(--u) * 3.2); white-space: nowrap;
  }
  .ok-btn.valide { background: #7CFFB2; border-color: #7CFFB2; color: var(--nuit); }
  /* Les 3 critères des étoiles, rappelés sous chaque fille pendant la routine */
  .crit-rappel { display: flex; gap: calc(var(--u) * .8); margin-top: calc(var(--u) * 1.2); font-size: calc(var(--u) * 3.4); }
  .crit-rappel span { background: rgba(255,255,255,.1); border-radius: 99px; padding: calc(var(--u) * .3) calc(var(--u) * 1.1); opacity: .75; white-space: nowrap; }
  .crit-rappel .n { font-size: calc(var(--u) * 2.6); font-weight: 700; margin-left: calc(var(--u) * .4); }
  .crit-rappel span.fait { background: rgba(124,255,178,.25); opacity: 1; }
  .crit-legende { font-size: calc(var(--u) * 3.6); opacity: .85; margin-top: calc(var(--u) * 2); }
  .crit-legende b { color: var(--or); }
  .avatar-svg .couette, .avatar-svg .queue { transform-box: fill-box; transform-origin: 50% 0%; animation: balance 1.8s ease-in-out infinite alternate; }
  @keyframes balance { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

  /* Papa ou Maman au centre de l'anneau pendant le câlin */
  .parent-anneau { position: absolute; left: 20%; right: 20%; top: 9%; height: 56%; display: none; }
  .parent-anneau svg { width: 100%; height: 100%; overflow: visible; }
  .anneau.calin .parent-anneau { display: block; }
  .anneau.calin .emoji-centre { visibility: hidden; }

  /* Au départ du bus */
  .fin-duo { position: absolute; left: 3vw; right: 3vw; bottom: calc(var(--u) * 3); display: flex; justify-content: space-between; pointer-events: none; }
  .fin-duo > div { height: calc(var(--u) * 44); }
  @keyframes coucouMain { from { transform: rotate(-30deg); } to { transform: rotate(25deg); } }

  /* ---------- La route ---------- */
  .route { display: flex; align-items: flex-end; gap: 2vw; height: calc(var(--u) * 19); }
  .piste-zone { position: relative; flex: 1; height: 100%; }
  .piste { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .6vw; }
  .seg { flex-basis: 0; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .seg-emoji { font-size: calc(var(--u) * 5); height: calc(var(--u) * 7); position: relative; }
  .seg-barre { width: 100%; height: calc(var(--u) * 3.2); border-radius: 99px; }
  .seg.fait { opacity: .35; }
  .seg.fait .seg-emoji::after {
    content: "✓"; position: absolute; right: calc(var(--u) * -2.2); top: calc(var(--u) * -1);
    font-size: calc(var(--u) * 4); font-weight: 700; color: #7CFFB2;
  }
  .seg.encours .seg-emoji { font-size: calc(var(--u) * 6.5); }
  .seg.encours .seg-barre { box-shadow: 0 0 calc(var(--u) * 2.5) var(--c); }
  .seg { transition: flex-grow .9s ease; position: relative; }
  .seg-gain {
    position: absolute; top: calc(var(--u) * -5.5); left: 50%; transform: translateX(-50%) scale(.5); opacity: 0;
    font-size: calc(var(--u) * 3.4); font-weight: 700; color: var(--nuit); background: #7CFFB2; white-space: nowrap;
    border-radius: 99px; padding: calc(var(--u) * .3) calc(var(--u) * 1.4); transition: transform .5s cubic-bezier(.2,1.6,.4,1), opacity .3s;
  }
  .seg-gain.visible { opacity: 1; transform: translateX(-50%) scale(1); }
  .perso {
    position: absolute; bottom: calc(var(--u) * 3.6); font-size: calc(var(--u) * 7); transform: translateX(-50%);
    transition: left .3s linear; white-space: nowrap;
  }
  /* Quand les filles avancent : Sundae bondit jusqu'à l'étape suivante */
  .perso.saute { transition: left .8s cubic-bezier(.4,0,.3,1); }
  .perso.saute .trot { animation: bond .8s ease-in-out; }
  @keyframes bond { 0% { transform: translateY(0); } 45% { transform: translateY(calc(var(--u) * -9)) rotate(-12deg); } 80% { transform: translateY(0) scaleY(.85); } 100% { transform: translateY(0); } }
  .arret { font-size: calc(var(--u) * 9); line-height: 1; }

  /* ---------- Écrans calmes ---------- */
  .calme { justify-content: center; align-items: center; text-align: center; }
  .calme .grand { font-size: calc(var(--u) * 26); line-height: 1.1; }
  .calme h2 { font-size: calc(var(--u) * 10); margin-top: calc(var(--u) * 2); }
  .calme p { font-size: calc(var(--u) * 5.5); opacity: .8; margin-top: calc(var(--u) * 2); }
  .calme .horloge { position: absolute; top: calc(var(--u) * 5); left: 5vw; }
  .calme .compteurs { position: absolute; top: calc(var(--u) * 6); right: 5vw; }
  .calme p.bocal-ligne { color: var(--or); opacity: 1; font-size: calc(var(--u) * 4.5); }
  .etoile-ciel { position: absolute; width: calc(var(--u) * .8); height: calc(var(--u) * .8); border-radius: 50%; background: #fff; animation: scintille 3s ease-in-out infinite; }
  @keyframes scintille { 50% { opacity: .15; } }
  .bus-roule { display: inline-block; animation: roule 7s linear infinite; white-space: nowrap; }
  @keyframes roule { from { transform: translateX(-80vw); } to { transform: translateX(80vw); } }

  /* ---------- Annonce de changement d'étape ---------- */
  #annonce {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20,24,51,.92); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .5s;
  }
  #annonce.visible { opacity: 1; }
  #annonce .annonce-emoji { font-size: calc(var(--u) * 38); line-height: 1.1; }
  #annonce.visible .annonce-emoji { animation: pop .9s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.2) rotate(-20deg); } to { transform: scale(1) rotate(0); } }
  #annonce .annonce-sur { font-size: calc(var(--u) * 6); color: var(--c); font-weight: 600; }
  #annonce .annonce-titre { font-size: calc(var(--u) * 12); font-weight: 700; }

  /* ---------- Les étoiles ---------- */
  [hidden] { display: none !important; }

  /* ---------- La boutique (le soir) ---------- */
  #ouvrirBoutique {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--u) * 4); z-index: 12;
    background: linear-gradient(180deg, #FFE27A, var(--or)); color: var(--nuit); border: none;
    font-size: calc(var(--u) * 5); font-weight: 800; border-radius: 99px;
    padding: calc(var(--u) * 2) calc(var(--u) * 6); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0,0,0,.35);
    animation: respire 3s ease-in-out infinite;
  }
  #boutique {
    position: fixed; inset: 0; z-index: 18; display: none; flex-direction: column;
    background: #10132A; text-align: left;
  }
  #boutique.visible { display: flex; }
  .bq-tete { display: flex; align-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 2) calc(var(--u) * 4); }
  .bq-titre { font-size: calc(var(--u) * 5); font-weight: 800; }
  .bq-qui { display: flex; gap: calc(var(--u) * 2); margin-left: auto; }
  .bq-qui button {
    background: rgba(255,255,255,.08); border: calc(var(--u) * .5) solid transparent; color: #fff;
    border-radius: 99px; padding: calc(var(--u) * 1.2) calc(var(--u) * 4);
    font-size: calc(var(--u) * 3.2); font-weight: 700;
  }
  .bq-qui button.choisie { background: rgba(255,255,255,.16); border-color: var(--f); color: var(--f); }
  .bq-fermer { background: rgba(255,255,255,.1); color: #fff; border: none; border-radius: 99px;
    width: calc(var(--u) * 7); height: calc(var(--u) * 7); font-size: calc(var(--u) * 4); }
  .bq-corps { flex: 1; display: flex; gap: calc(var(--u) * 3); padding: 0 calc(var(--u) * 4) calc(var(--u) * 3); min-height: 0; }
  .bq-vitrine { width: calc(var(--u) * 30); display: flex; flex-direction: column; align-items: center; }
  .bq-vitrine svg { width: 100%; height: calc(var(--u) * 46); }
  .bq-solde { font-size: calc(var(--u) * 3.6); font-weight: 800; color: var(--or); white-space: nowrap; }
  .bq-porte { font-size: calc(var(--u) * 2.3); opacity: .7; text-align: center; margin-top: calc(var(--u) * 1); }
  .bq-droite { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .bq-filtres { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1.2); padding-bottom: calc(var(--u) * 1.4); }
  .bq-filtres button {
    background: rgba(255,255,255,.08); border: calc(var(--u) * .4) solid transparent; color: #fff;
    border-radius: 99px; padding: calc(var(--u) * .8) calc(var(--u) * 2);
    font-size: calc(var(--u) * 2.3); font-weight: 700;
  }
  .bq-filtres button.choisi { background: var(--or); border-color: var(--or); color: var(--nuit); }
  .bq-rayons { flex: 1; overflow-y: auto; }
  .bq-rayon-titre { font-size: calc(var(--u) * 3.4); font-weight: 800; margin: calc(var(--u) * 2) 0 calc(var(--u) * 1.5); }
  .bq-rayon-titre small { font-weight: 500; opacity: .6; margin-left: calc(var(--u) * 2); font-size: calc(var(--u) * 2.3); }
  .bq-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--u) * 14.5), 1fr)); gap: calc(var(--u) * 1.2); }
  .bq-article {
    background: rgba(255,255,255,.07); border: calc(var(--u) * .5) solid rgba(255,255,255,.12); color: #fff;
    border-radius: calc(var(--u) * 2.4); padding: calc(var(--u) * 1.1) calc(var(--u) * .6); text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * .3);
    transition: transform .15s, background .2s, border-color .2s;
  }
  .bq-article .e { font-size: calc(var(--u) * 4.4); line-height: 1.1; }
  .bq-article .n { font-size: calc(var(--u) * 1.95); font-weight: 700; line-height: 1.15; }
  .bq-article .p { font-size: calc(var(--u) * 1.95); font-weight: 700; color: var(--or); }
  .bq-article.cher { opacity: .45; }
  .bq-article.cher .p { color: #fff; }
  .bq-article.a-moi { background: rgba(124,255,178,.12); border-color: rgba(124,255,178,.45); }
  .bq-article.portee { background: rgba(255,217,61,.18); border-color: var(--or); transform: scale(1.03); }
  .bq-article.secoue { animation: secousse .4s; }
  @keyframes secousse { 25% { transform: translateX(calc(var(--u) * -1)); } 75% { transform: translateX(calc(var(--u) * 1)); } }
  .bq-confirme { position: absolute; inset: 0; background: rgba(16,19,42,.9); display: flex; align-items: center; justify-content: center; }
  .bq-carte { text-align: center; }
  .bq-gros { font-size: calc(var(--u) * 16); }
  .bq-question { font-size: calc(var(--u) * 5); font-weight: 700; margin: calc(var(--u) * 2) 0 calc(var(--u) * 4); }
  .bq-vide { opacity: .6; font-size: calc(var(--u) * 3.6); }
  #notes {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 15;
    display: none; align-items: center; justify-content: center;
    background: rgba(20,24,51,.97); text-align: center;
  }
  #notes.visible { display: flex; }
  .notes-titre { font-size: calc(var(--u) * 9); font-weight: 700; }
  .notes-bus { font-size: calc(var(--u) * 4.5); opacity: .75; margin: calc(var(--u) * 1) 0 calc(var(--u) * 4); }
  .ligne-fille {
    display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 4);
    margin-bottom: calc(var(--u) * 3);
  }
  .ligne-fille .nom {
    width: calc(var(--u) * 30); text-align: right; font-size: calc(var(--u) * 9); font-weight: 700; color: var(--f);
  }
  .etoiles { display: flex; gap: calc(var(--u) * 1.5); }
  .crit-choix { display: flex; gap: calc(var(--u) * 1.5); }
  .crit-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: calc(var(--u) * 22); padding: calc(var(--u) * 1.2) calc(var(--u) * .8); border-radius: calc(var(--u) * 3);
    background: rgba(255,255,255,.07); border: calc(var(--u) * .5) solid rgba(255,255,255,.15); color: #fff;

<script>
(function () {
  "use strict";

  // Les routines (horaires, étapes, voix) se modifient dans l'espace parent, onglet Routines.
  // La routine École d'origine est dans commun.js.

  // =====================================================================
  // Test : ajoute à l'adresse  ?heure=07:44:50&vitesse=10&ecole=1
  //        routine=<id> pour tester une routine précise, voix=0 pour couper la voix,
  //        auto=1 pour sauter l'écran de démarrage, parent=Maman.
  //        En mode test, rien n'est enregistré.
  // =====================================================================
  var q = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;
    var p = kv.split("=");
    q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
  });

  var SIM = null;
  if (q.heure) {
    var hp = q.heure.split(":"), base = new Date();
    base.setHours(+hp[0], +hp[1], +(hp[2] || 0), 0);
    SIM = { debut: base.getTime(), reel: Date.now(), vitesse: parseFloat(q.vitesse) || 1 };
    document.getElementById("modeTest").style.display = "block";
  }
  var VOIX_ACTIVE = q.voix !== "0";
  var FILLES = MATIN.FILLES;
  var stock = MATIN.creerStock({ test: !!SIM });
  var PARENT = "Papa";

  function $(id) { return document.getElementById(id); }
  var pad = MATIN.pad, cleJour = MATIN.cleJour, sec = MATIN.sec, esc = MATIN.esc;
  function maintenant() {
    return SIM ? new Date(SIM.debut + (Date.now() - SIM.reel) * SIM.vitesse) : new Date();
  }
  function pluriel(n, mot) { return n + " " + mot + (n > 1 ? "s" : ""); }
  function perso(t) { return (t || "").replace(/\{parent\}/g, PARENT); }
  function heureLisible(hhmm) { return String(hhmm).replace(/^0/, "").replace(":", "h"); }
  function dansMinutes(secondes) {
    var m = Math.ceil(secondes / 60);
    return m >= 60 ? Math.floor(m / 60) + " h " + (m % 60 ? pad(m % 60) : "") : m + " min";
  }

  var C = 2 * Math.PI * 90;
  $("arc").style.strokeDasharray = C;

  // ---------- Programme du jour et réglages (recalculés quand les données changent) ----------
  var progCle = null, prog = null;
  function programmeDuJour(d) {
    var cle = cleJour(d) + "|" + stock.version() + "|" + Math.floor(Date.now() / 60000);
    if (cle !== progCle) {
      progCle = cle;
      prog = MATIN.programme(stock, d, { forcer: q.ecole === "1" || !!q.routine, routine: q.routine });
      prog.routines.forEach(function (x) { x.sig = JSON.stringify(x.r); });
    }
    return prog;
  }
  var decorCle = null, decor = { particules: [], fete: null }, regl = MATIN.reglages(stock);
  // Sundae dessinée (🐈 = tigrée comme la vraie, 🐈‍⬛ = noire), ou les filles si pas de mascotte
  function dessinMascotte(pose) {
    if (!regl.mascotte) return "👧👧";
    return AVATARS.chat(pose || "marche", regl.mascotte === "🐈" ? "tigre" : "noir");
  }
  function majReglages(d) {
    regl = MATIN.reglages(stock);
    decor = MATIN.decorDuJour(d, regl);
    document.body.classList.toggle("sans-chat", !regl.mascotte);
    var masc = document.querySelectorAll(".mascotte");
    for (var k = 0; k < masc.length; k++) masc[k].innerHTML = dessinMascotte(masc[k].getAttribute("data-pose"));
    var cle = decor.particules.join("");
    if (cle !== decorCle) { decorCle = cle; construireDecor(decor.particules); }
    if (etatCourant) afficherDecor(etatCourant.split(":")[0]);
  }
  function construireDecor(liste) {
    var html = "";
    if (liste.length) {
      for (var n = 0; n < 16; n++) {
        var taille = 3 + Math.random() * 3.5;
        html += '<span class="particule" style="left:' + (Math.random() * 96) + '%;font-size:calc(var(--u) * ' + taille.toFixed(1) +
                ');opacity:' + (0.35 + Math.random() * 0.3).toFixed(2) + ';animation-duration:' + (11 + Math.random() * 9).toFixed(1) +
                's;animation-delay:-' + (Math.random() * 20).toFixed(1) + 's">' + liste[n % liste.length] + '</span>';
      }
    }
    $("decor").innerHTML = html;
  }

  function majCompteurs() {
    var html = FILLES.map(function (f) {
      return '<span class="compteur" style="--f:' + f.couleur + '">' + f.nom +
             ' <span class="n">⭐ ' + MATIN.solde(stock, f.nom) + '</span></span>';
    }).join("");
    var c = MATIN.cagnotte(stock);
    if (c) {
      html += '<span class="compteur bocal' + (c.pleine ? " pleine" : "") + '">' + (c.pleine ? "🎉" : "🫙") +
              ' <span class="n">' + Math.min(c.progres, c.objectif) + "/" + c.objectif + '</span></span>';
    }
    var blocs = document.querySelectorAll(".compteurs");
    for (var k = 0; k < blocs.length; k++) blocs[k].innerHTML = html;
    var texte = !c ? "" : c.pleine ? "🎉 Le bocal est plein : " + c.recompense
      : "🫙 Encore " + pluriel(c.objectif - c.progres, "étoile") + " pour " + c.recompense;
    $("finBocal").textContent = texte;
    $("reposBocal").textContent = texte;
    $("finBoutique").textContent = FILLES.map(function (f) {
      var v = MATIN.vitrine(stock, f.nom);
      if (!v) return "";
      return v.manque ? f.nom + " : encore " + pluriel(v.manque, "étoile") + " pour " + v.article.emoji
                      : f.nom + " peut s'offrir " + v.article.emoji + " !";
    }).filter(Boolean).join("   ·   ");
    $("dodoCriteres").innerHTML = "⭐ Les 3 étoiles : " + MATIN.CRITERES.map(function (k) {
      return "<b>" + k.emoji + "</b> " + esc(k.court);
    }).join(" · ");
  }

  // ---------- Son (généré, aucun fichier) ----------
  var audio = null;
  function note(freq, t0, dur, vol) {
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  var SONS = {
    etape:   [[523, 0], [659, .15], [784, .3], [1047, .45, .8]],
    alerte:  [[880, 0, .25], [880, .35, .25]],
    bus:     [[784, 0], [659, .2], [784, .4], [1047, .6], [1319, .8, 1]],
    etoile:  [[1319, 0, .15]],
    fanfare: [[523, 0, .2], [523, .2, .2], [523, .4, .2], [659, .6, .5], [587, 1.1, .2], [659, 1.3, .2], [784, 1.5, 1.2]],
    bocal:   [[784, 0, .15], [988, .12, .15], [1175, .24, .15], [1568, .36, .9], [1319, 1.2, .2], [1568, 1.4, 1.2]]
  };
  function jouer(nom, decalage) {
    if (!audio) return;
    var t = audio.currentTime + 0.05 + (decalage || 0);
    SONS[nom].forEach(function (n) { note(n[0], t + n[1], n[2] || .4, .3); });
  }

  // ---------- Musique de fond : nappes douces et petits carillons, générés (aucun fichier) ----------
  var musiqueVoulue = true;
  try { musiqueVoulue = localStorage.getItem("matin.musique") !== "0"; } catch (err) {}
  if (q.musique === "0") musiqueVoulue = false;
  var Musique = (function () {
    var bus = null, minuteur = null, prochainAccord = 0, prochaineNote = 0, indexAccord = 0, baisseJusqua = 0, niveau = 0;
    // Do maj7, La m7, Fa maj7, Sol 6 : calme, sans tension
    var ACCORDS = [[130.81, 164.81, 196.00, 246.94], [110.00, 130.81, 164.81, 196.00], [87.31, 110.00, 130.81, 164.81], [98.00, 123.47, 146.83, 164.81]];
    var GAMME = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    function nappe(freq, t0, dur) {
      [["sine", 0], ["triangle", 5]].forEach(function (v) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = v[0]; o.frequency.value = freq; o.detune.value = v[1];
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.03, t0 + 2.5);
        g.gain.setValueAtTime(0.03, t0 + dur - 2.5);
        g.gain.linearRampToValueAtTime(0.0001, t0 + dur + 1.5);
        o.connect(g); g.connect(bus);
        o.start(t0); o.stop(t0 + dur + 1.6);
      });
    }
    function carillon(freq, t0) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
      o.connect(g); g.connect(bus);
      o.start(t0); o.stop(t0 + 2.5);
    }
    function planifier() {
      var now = audio.currentTime;
      if (prochainAccord < now) prochainAccord = now + 0.1;
      if (prochaineNote < now) prochaineNote = now + 1.5;
      while (prochainAccord < now + 6) {
        ACCORDS[indexAccord % ACCORDS.length].forEach(function (f) { nappe(f, prochainAccord, 8); });
        indexAccord++; prochainAccord += 8;
      }
      while (prochaineNote < now + 6) {
        carillon(GAMME[Math.floor(Math.random() * GAMME.length)], prochaineNote);
        prochaineNote += 1.6 + Math.random() * 2.4;
      }
    }
    return {
      // voulu : la musique doit-elle jouer maintenant ? Appelée en boucle.
      maj: function (voulu) {
        if (!audio) return;
        if (!bus) { bus = audio.createGain(); bus.gain.value = 0; bus.connect(audio.destination); }
        var vise = !voulu ? 0 : Date.now() < baisseJusqua ? 0.12 : 0.35;
        if (vise !== niveau) { niveau = vise; bus.gain.setTargetAtTime(vise, audio.currentTime, vise === 0 ? 1.5 : 0.4); }
        if (voulu && !minuteur) { planifier(); minuteur = setInterval(planifier, 1000); }
        if (!voulu && minuteur && bus.gain.value < 0.005) { clearInterval(minuteur); minuteur = null; prochainAccord = 0; prochaineNote = 0; }
      },
      baisser: function () { baisseJusqua = Date.now() + 7000; }
    };
  })();

  // ---------- Voix ----------
  function parler(txt, delai) {
    if (!VOIX_ACTIVE || !demarre || !window.speechSynthesis || !txt) return;
    Musique.baisser();
    setTimeout(function () {
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = "fr-FR"; u.rate = .95; u.pitch = 1.1;
      var v = speechSynthesis.getVoices().filter(function (x) { return /^fr/i.test(x.lang); })[0];
      if (v) u.voice = v;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }, delai === undefined ? 1100 : delai);
  }

  var BOCAL_FORME = "M22 34 Q12 40 12 54 V106 Q12 120 28 120 H72 Q88 120 88 106 V54 Q88 40 78 34 Z";

  function montrerBravo(notes, avant, cleN) {
    var gagne = somme(notes) - somme(avant);
    var c = MATIN.cagnotte(stock);
    var htmlBocal = "", bocalRempli = false;
    if (c) {
      var avantProgres = Math.max(0, c.progres - gagne);
      bocalRempli = avantProgres < c.objectif && c.pleine;
      htmlBocal = '<div class="bocal' + (c.pleine ? " pleine" : "") + '">' +
        '<svg viewBox="0 0 100 124"><defs><clipPath id="formeBocal"><path d="' + BOCAL_FORME + '"/></clipPath></defs>' +
        '<g clip-path="url(#formeBocal)"><rect class="niveau" id="niveauBocal" x="0" y="34" width="100" height="86" fill="#FFD93D"/></g>' +
        '<path d="' + BOCAL_FORME + '" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.85)" stroke-width="4"/>' +
        '<rect x="24" y="20" width="52" height="14" rx="4" fill="#C8A26B"/>' +
        '<text x="50" y="84" text-anchor="middle" font-size="26">' + (c.pleine ? "🎉" : "⭐") + '</text></svg>' +
        '<div class="chiffre">' + Math.min(c.progres, c.objectif) + ' / ' + c.objectif + '</div>' +
        '<div class="texte-bocal">' + (c.pleine ? "Le bocal est plein !<br>" + esc(c.recompense)
          : "Encore " + pluriel(c.objectif - c.progres, "étoile") + "<br>pour " + esc(c.recompense)) + '</div></div>';
      setTimeout(function () {
        var niv = $("niveauBocal");
        if (!niv) return;
        niv.style.transition = "none";
        niv.style.transform = "scaleY(" + Math.min(1, avantProgres / c.objectif) + ")";
        void niv.getBoundingClientRect();
        niv.style.transition = "";
        setTimeout(function () { niv.style.transform = "scaleY(" + Math.min(1, c.progres / c.objectif) + ")"; }, 400);
      }, 50);
    }
    $("bravo").innerHTML =
      '<div class="bravo-titre">Bravo les filles !</div>' +
      '<div class="bravo-contenu"><div class="bravo-filles">' + FILLES.map(function (f) {
        var n = notes[f.nom] || 0, crit = cleN ? stock.lire("criteres/" + cleN + "/" + f.nom) : null;
        var gagnes = crit ? MATIN.CRITERES.filter(function (k) { return crit[k.cle]; }).map(function (k) { return k.emoji; }).join(" ") : "";
        var v = MATIN.vitrine(stock, f.nom);
        var boutique = !v ? "" : v.manque
          ? '<div class="boutique">🛍️ Encore ' + pluriel(v.manque, "étoile") + ' pour ' + esc(v.article.emoji) + ' ' + esc(v.article.nom) + '</div>'
          : '<div class="boutique peut">🛍️ Tu peux t\'offrir ' + esc(v.article.emoji) + ' ' + esc(v.article.nom) + ' !</div>';
        return '<div class="bravo-fille" style="--f:' + f.couleur + '">' +
               '<div class="avatar-bravo" id="bravoAv' + FILLES.indexOf(f) + '"></div>' +
               '<div class="nom">' + f.nom + '</div>' +
               '<div class="gagne">' + (n ? new Array(n + 1).join("★") : "☆") + '</div>' +
               '<div class="criteres-gagnes">' + gagnes + '</div>' +
               '<div class="total">' + MATIN.solde(stock, f.nom) + ' ⭐ à dépenser</div>' + boutique + '</div>';
      }).join("") + '</div>' + htmlBocal + '</div>' +
      '<div class="sundae-saut gauche"><span class="mascotte">' + dessinMascotte("marche") + '</span></div>' +
      '<div class="sundae-saut droite"><span class="miroir mascotte">' + dessinMascotte("marche") + '</span></div>';
    $("notesBoite").style.display = "none";
    $("bravo").style.display = "block";
    $("notes").classList.add("visible");
    var etatBravo = MATIN.etatFinAvatar(cible && cible.r);
    etatBravo.activite = "coucou";
    etatBravo.cartable = false;
    poserAvatars("bravo", ["bravoAv0", "bravoAv1"], etatBravo, false);
    jouer("fanfare");
    var phrase = FILLES.filter(function (f) { return notes[f.nom]; }).map(function (f) {
      var v = MATIN.vitrine(stock, f.nom);
      return "Bravo " + f.nom + ", " + pluriel(notes[f.nom], "étoile") + " !" +
             (v && !v.manque ? " Tu peux t'offrir " + MATIN.sansEmoji(v.article.nom) + " !" : "");
    }).join(" ");
    if (bocalRempli) {
      jouer("bocal", 3);
      phrase += " Et le bocal est plein ! " + MATIN.sansEmoji(c.recompense) + " !";
    }
    parler(phrase, 900);
    clearTimeout(timerBravo);
    timerBravo = setTimeout(fermerNotes, bocalRempli ? 14000 : 10000);
  }

  function notesAujourdhui() {
    var jour = cleJour(maintenant()), toutes = stock.lire("notes") || {}, map = {};
    for (var k in toutes) if (k.slice(0, 10) === jour) map[k] = JSON.stringify(toutes[k]);
    return { jour: jour, map: map };
  }
  function verifierNouvellesNotes() {
    if (!stock.synchronise()) return;
    var n = notesAujourdhui();
    if (!notesVues || notesVues.jour !== n.jour) { notesVues = n; return; }
    var change = null;
    for (var k in n.map) {
      if (n.map[k] !== notesVues.map[k]) change = { cle: k, avant: notesVues.map[k] ? JSON.parse(notesVues.map[k]) : {} };
    }
    notesVues = n;
    if (change && demarre) montrerBravo(JSON.parse(n.map[change.cle]), change.avant, change.cle);
  }

  $("notesFilles").addEventListener("click", function (ev) {
    var b = ev.target.closest(".crit-btn");
    if (!b) return;
    var c = notesEnCours[b.getAttribute("data-nom")], k = b.getAttribute("data-k");
    c[k] = !c[k];
    if (c[k]) jouer("etoile");
    majEtoiles();
  });
  $("notesValider").addEventListener("click", validerNotes);
  $("notesPlusTard").addEventListener("click", fermerNotes);
  $("bravo").addEventListener("click", fermerNotes);
  var blocsCompteurs = document.querySelectorAll(".compteurs");
  for (var k = 0; k < blocsCompteurs.length; k++) {
    blocsCompteurs[k].addEventListener("click", function () { ouvrirNotes(null); });
  }

  // ---------- La boutique : elles dépensent leurs étoiles le soir ----------
  // Ouverte de 15h à 22h (dès 9h les jours sans école), jamais pendant la routine.
  var BQ = { fille: FILLES[0].nom, ouverte: false, enCours: null, filtre: "tout" };

  function boutiqueOuvrable(s, etat) {
    if (etat === "routine") return false;
    return s >= (etat === "repos" ? 9 : 15) * 3600 && s < 22 * 3600;
  }
  function filleDe(nom) { return FILLES.filter(function (f) { return f.nom === nom; })[0] || FILLES[0]; }

  function ouvrirBoutique(nom) {
    BQ.fille = nom || BQ.fille;
    BQ.ouverte = true;
    $("boutique").classList.add("visible");
    dessinerBoutique();
  }
  function fermerBoutique() {
    BQ.ouverte = false; BQ.enCours = null;
    $("boutique").classList.remove("visible");
    $("bqConfirme").hidden = true;
    animes = animes.filter(function (a) { return a.zone !== "boutique"; });
    $("bqAvatar").innerHTML = "";
  }

  function dessinerBoutique() {
    if (!BQ.ouverte) return;
    var f = filleDe(BQ.fille), sou = MATIN.solde(stock, f.nom), portes = MATIN.portes(stock, f.nom);
    var dispo = MATIN.enRayon(stock, f.nom, maintenant());
    $("bqQui").innerHTML = FILLES.map(function (g) {
      return '<button data-fille="' + g.nom + '" style="--f:' + g.couleur + '" class="' + (g.nom === BQ.fille ? "choisie" : "") + '">' +
             g.nom + " · " + MATIN.solde(stock, g.nom) + " ⭐</button>";
    }).join("");
    $("bqSolde").textContent = sou + " ⭐ à dépenser";

    // L'avatar d'essayage, animé comme pendant la routine
    animes = animes.filter(function (a) { return a.zone !== "boutique"; });
    $("bqAvatar").innerHTML = "";
    var objet = AVATARS.creer($("bqAvatar"), f, MATIN.apparence(stock, f.nom));
    var e = { tenue: "ecole", chaussures: portes.pieds !== "chaussettes", activite: "coucou" };
    objet.maj(e, "coucou", performance.now() / 1000, 0, 1);
    animes.push({ objet: objet, etat: e, zone: "boutique", sens: 1 });

    var mis = Object.keys(portes).map(function (k) {
      var a = MATIN.articleDe(portes[k]);
      return a ? a.emoji + " " + a.nom : "";
    }).filter(Boolean);
    $("bqPorte").textContent = mis.length ? "Elle porte " + mis.join(", ") : "Clique sur ce que tu as acheté pour le porter";

    // Les filtres : tout, un rayon, ou seulement sa garde-robe
    var aMoiCount = dispo.filter(function (a) { return MATIN.possede(stock, f.nom, a.id); }).length;
    var choix = [{ cle: "tout", nom: "Tout" }];
    MATIN.RAYONS.forEach(function (r) {
      if (dispo.filter(function (a) { return a.rayon === r.cle; }).length) choix.push({ cle: r.cle, nom: r.emoji + " " + r.nom });
    });
    choix.push({ cle: "amoi", nom: "🎀 Ma garde-robe (" + aMoiCount + ")" });
    if (!choix.filter(function (c) { return c.cle === BQ.filtre; }).length) BQ.filtre = "tout";
    $("bqFiltres").innerHTML = choix.map(function (c) {
      return '<button data-filtre="' + c.cle + '" class="' + (c.cle === BQ.filtre ? "choisi" : "") + '">' + esc(c.nom) + "</button>";
    }).join("");

    function carte(a) {
      var aMoi = MATIN.possede(stock, f.nom, a.id), portee = portes[a.emplacement] === a.id;
      var cls = portee ? "portee" : aMoi ? "a-moi" : sou >= a.cout ? "" : "cher";
      var dit = portee ? "Elle le porte ✓" : aMoi ? "Dans la garde-robe" : sou >= a.cout ? a.cout + " ⭐" : "Encore " + (a.cout - sou) + " ⭐";
      return '<button class="bq-article ' + cls + '" data-article="' + a.id + '">' +
             '<span class="e">' + a.emoji + '</span><span class="n">' + esc(a.nom) + "</span>" +
             '<span class="p">' + dit + "</span></button>";
    }
    if (BQ.filtre === "amoi") {
      var aElle = dispo.filter(function (a) { return MATIN.possede(stock, f.nom, a.id); });
      $("bqRayons").innerHTML = aElle.length
        ? '<div class="bq-rayon-titre">🎀 Ce que ' + esc(f.nom) + " a déjà<small>Clique pour le mettre ou l'enlever</small></div>" +
          '<div class="bq-grille">' + aElle.map(carte).join("") + "</div>"
        : '<div class="bq-vide">Rien encore. Choisis quelque chose dans les rayons !</div>';
      return;
    }
    $("bqRayons").innerHTML = MATIN.RAYONS.map(function (r) {
      if (BQ.filtre !== "tout" && BQ.filtre !== r.cle) return "";
      var liste = dispo.filter(function (a) { return a.rayon === r.cle; });
      if (!liste.length) return "";
      return '<div class="bq-rayon-titre">' + r.emoji + " " + esc(r.nom) + "<small>" + esc(r.sous) + "</small></div>" +
        '<div class="bq-grille">' + liste.map(carte).join("") + "</div>";
    }).join("");
  }

  $("ouvrirBoutique").addEventListener("click", function () { ouvrirBoutique(null); });
  $("bqFermer").addEventListener("click", fermerBoutique);
  $("bqcNon").addEventListener("click", function () { $("bqConfirme").hidden = true; BQ.enCours = null; });
  $("bqcOui").addEventListener("click", function () {
    var a = BQ.enCours, nom = BQ.fille;
    $("bqConfirme").hidden = true; BQ.enCours = null;
    if (!a || MATIN.solde(stock, nom) < a.cout) return;
    stock.ecrire("boutique/achats/" + nom + "/" + a.id, { cout: a.cout, le: MATIN.cleJour(maintenant()) });
    stock.ecrire("boutique/portes/" + nom + "/" + a.emplacement, a.id);
    jouer("bocal");
    parler(nom + " a acheté " + MATIN.sansEmoji(a.nom) + " !");
    dessinerBoutique();
  });
  $("boutique").addEventListener("click", function (ev) {
    var q = ev.target.closest && ev.target.closest("button[data-fille]");
    if (q) { BQ.fille = q.getAttribute("data-fille"); dessinerBoutique(); return; }
    var fi = ev.target.closest && ev.target.closest("button[data-filtre]");
    if (fi) { BQ.filtre = fi.getAttribute("data-filtre"); dessinerBoutique(); return; }
    var b = ev.target.closest && ev.target.closest("button[data-article]");
    if (!b) return;
    var a = MATIN.articleDe(b.getAttribute("data-article")), nom = BQ.fille;
    if (!a) return;
    if (MATIN.possede(stock, nom, a.id)) { // déjà à elle : on le met ou on l'enlève
      var portes = MATIN.portes(stock, nom);
      stock.ecrire("boutique/portes/" + nom + "/" + a.emplacement, portes[a.emplacement] === a.id ? null : a.id);
      jouer("etoile");
      dessinerBoutique();
      return;
    }
    if (MATIN.solde(stock, nom) < a.cout) { // pas encore assez d'étoiles
      b.classList.remove("secoue");
      void b.offsetWidth;
      b.classList.add("secoue");
      return;
    }
    BQ.enCours = a;
    $("bqcEmoji").textContent = a.emoji;
    $("bqcTexte").innerHTML = esc(nom) + ", tu achètes <b>" + esc(a.nom) + "</b> pour " + a.cout + " ⭐ ?";
    $("bqConfirme").hidden = false;
  });

  // Données modifiées (ici ou depuis l'espace parent)
  stock.surChangement(function () {
    majReglages(maintenant());
    majCompteurs();
    if (etatCourant && etatCourant.indexOf("routine:") === 0 && cible && pisteSig === cible.sig) {
      afficherEtape(cible.r, idxCourant);
    }
    verifierNouvellesNotes();
    majEtatSync();
    if (BQ.ouverte) dessinerBoutique();
  });

  function majEtatSync() {
    var e = stock.etat();
    $("etatSync").textContent = SIM ? "Mode test : rien n'est enregistré"
      : e === "en ligne" ? "⭐ Étoiles, rappels et routines synchronisés"
      : e === "connexion" ? "Connexion…"
      : e === "hors ligne" ? "Hors ligne : les étoiles seront envoyées au retour de la connexion"
      : "Mode local : étoiles enregistrées sur cet appareil seulement";
  }

  // ---------- Boucle principale ----------
  var jourReglages = null;
  function tick() {
    var d = maintenant();
    var s = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
    var jour = cleJour(d);
    if (jour !== jourReglages) { jourReglages = jour; majReglages(d); }
    var txt = d.getHours() + "h" + pad(d.getMinutes());
    var horloges = document.querySelectorAll(".horloge");
    for (var k = 0; k < horloges.length; k++) horloges[k].textContent = txt;

    // Quelle routine maintenant, laquelle vient de finir, laquelle arrive ?
    var p = programmeDuJour(d), courante = null, derniere = null, prochaine = null;
    p.routines.forEach(function (x) {
      if (s >= x.r.debutS && s < x.r.finS) courante = x;
      else if (s >= x.r.finS) { if (!derniere || x.r.finS > derniere.r.finS) derniere = x; }
      else if (!prochaine || x.r.debutS < prochaine.r.debutS) prochaine = x;
    });
    var etat, nouvelle = null;
    if (courante) { etat = "routine"; nouvelle = courante; }
    else if (prochaine && (prochaine.r.debutS - s <= 3600 || !derniere)) {
      etat = prochaine.r.debutS < 12 * 3600 ? "dodo" : "attente"; nouvelle = prochaine;
    }
    else if (derniere) { etat = "fin"; nouvelle = derniere; }
    else etat = "repos";

    var cleEtat = etat + ":" + (nouvelle ? nouvelle.id : "");
    if (cleEtat !== etatCourant) {
      if (etat === "fin" && etatCourant === "routine:" + nouvelle.id && demarre) {
        jouer("bus");
        parler(perso(nouvelle.r.finVoix));
      }
      if (etat !== "routine") { cleEtape = null; pisteSig = null; }
      etatCourant = cleEtat;
      montrerEcran(etat);
      if (etat === "fin") poserAvatars("fin", ["finGauche", "finDroite"], MATIN.etatFinAvatar(nouvelle.r), true);
    }
    cible = nouvelle;
    var boutiquePossible = boutiqueOuvrable(s, etat);
    $("ouvrirBoutique").hidden = !boutiquePossible;
    if (!boutiquePossible && BQ.ouverte) fermerBoutique();
    Musique.maj(demarre && musiqueVoulue && etat === "routine");
    var fete = decor.fete ? "🎂 Joyeux anniversaire " + decor.fete.nom + " !" : null;

    if (etat === "routine") majRoutine(cible, s);
    if (etat === "dodo") {
      var reste = cible.r.debutS - s;
      $("dodoTitre").textContent = fete || "Chut… tout le monde dort";
      $("dodoReste").textContent = reste <= 3600
        ? "Réveil dans " + Math.ceil(reste / 60) + " min"
        : "Réveil à " + heureLisible(cible.r.etapes[0].debut);
    }
    if (etat === "attente") {
      $("attenteEmoji").textContent = cible.r.emoji || "⏳";
      $("attenteTitre").textContent = fete || cible.r.nom + " à " + heureLisible(cible.r.etapes[0].debut);
      $("attenteTexte").textContent = (fete ? cible.r.nom + " " : "") + "dans " + dansMinutes(cible.r.debutS - s);
    }
    if (etat === "fin") {
      $("finAnim").textContent = cible.r.finEmoji || "🏁";
      $("finMessage").textContent = fete || perso(cible.r.finMessage) || "Bravo les filles !";
      $("finSous").textContent = perso(cible.r.finSous);
    }
    if (etat === "repos") {
      $("reposEmoji").textContent = fete ? "🎂" : "🎉";
      $("reposTitre").textContent = fete || "Pas d'école aujourd'hui";
      $("reposTexte").textContent = p.raison || "Profitez bien !";
    }

    // Ouverture automatique des étoiles, une fois par routine, si pas encore notées
    var xn = (etat === "routine" || etat === "fin") ? cible : null;
    if (demarre && xn && xn.r.etoiles && xn.r.heureNotes && stock.synchronise()) {
      var cleN = MATIN.cleNote(jour, xn.id);
      if (s >= sec(xn.r.heureNotes) && s < xn.r.finS + 3600 && !autoOuvert[cleN]) {
        autoOuvert[cleN] = true;
        if (!stock.lire("notes/" + cleN)) {
          ouvrirNotes(xn);
          jouer("etoile");
          parler(PARENT + ", c'est l'heure des étoiles !", 300);
        }
      }
    }
    $("notesBus").textContent = etat === "routine"
      ? (cible.r.finEmoji || "") + " " + (cible.r.finTitre || "Fin") + " dans " + Math.ceil((cible.r.finS - s) / 60) + " min" : "";
    if (notesVues && notesVues.jour !== jour) verifierNouvellesNotes();
  }

  // Étoiles du ciel de l'écran dodo
  for (var n = 0; n < 40; n++) {
    var et = document.createElement("div");
    et.className = "etoile-ciel";
    et.style.left = Math.random() * 100 + "%";
    et.style.top = Math.random() * 100 + "%";
    et.style.animationDelay = (Math.random() * 3) + "s";
    $("dodo").appendChild(et);
  }

  // ---------- Démarrage ----------
  function lancer(parent) {
    if (demarre) return;
    demarre = true;
    PARENT = parent || "Papa";
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { audio = new AC(); if (audio.resume) audio.resume(); }
    } catch (err) { audio = null; }
    // iPad : la voix doit parler une première fois pendant le toucher pour être débloquée
    if (VOIX_ACTIVE && window.speechSynthesis) {
      var u = new SpeechSynthesisUtterance("C'est parti !");
      u.lang = "fr-FR";
      speechSynthesis.speak(u);
    }
    $("demarrer").style.display = "none";
    $("btnMusique").style.display = "block";
    majBtnMusique();
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (err) {}
    if (etatCourant && etatCourant.indexOf("routine:") === 0 && cible) {
      afficherEtape(cible.r, idxCourant);
      annoncer(cible.r, idxCourant);
    }
  }
  function majBtnMusique() { $("btnMusique").textContent = musiqueVoulue ? "🎵" : "🔇"; }
  $("btnMusique").addEventListener("click", function () {
    musiqueVoulue = !musiqueVoulue;
    try { localStorage.setItem("matin.musique", musiqueVoulue ? "1" : "0"); } catch (err) {}
    majBtnMusique();
  });
  $("demarrer").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-parent]");
    if (b) lancer(b.getAttribute("data-parent"));
  });
  document.addEventListener("keydown", function (ev) { if (!demarre) { ev.preventDefault(); lancer("Papa"); } });
  if (window.speechSynthesis) speechSynthesis.getVoices();

  MATIN.Calendrier.charger();
  setInterval(MATIN.Calendrier.charger, 6 * 3600 * 1000);
  majReglages(maintenant());
  majCompteurs();
  majEtatSync();
  verifierNouvellesNotes();
  tick();
  setInterval(tick, 200);
  requestAnimationFrame(animerAvatars);
  if (q.auto === "1") lancer(q.parent || "Papa");
})();
</script>
</body>
</html>
