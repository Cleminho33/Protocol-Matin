<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le matin">
<meta name="theme-color" content="#141833">
<link rel="apple-touch-icon" href="icone.png">
<title>Le matin de Lou et Alba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* --u = unité d'échelle : s'adapte à la télé (16:9) comme à l'iPad (4:3) */
  :root { --c: #FF9F43; --nuit: #141833; --or: #FFD93D; --u: min(1vh, 0.6vw); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif;
    color: #fff; background: var(--nuit);
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; }

  #halo {
    position: fixed; left: -20vw; top: -30vh; width: 90vw; height: 120vh;
    border-radius: 50%; background: var(--c); opacity: .28; filter: blur(12vh);
    transition: background-color 1.5s;
  }

  /* ---------- Décor des saisons ---------- */
  #decor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; }
  .particule {
    position: absolute; top: -12vh; line-height: 1;
    animation: chute linear infinite; will-change: transform;
  }
  @keyframes chute {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    25%  { transform: translate3d(3vw, 30vh, 0) rotate(60deg); }
    50%  { transform: translate3d(-2vw, 62vh, 0) rotate(140deg); }
    75%  { transform: translate3d(3vw, 92vh, 0) rotate(220deg); }
    100% { transform: translate3d(0, 125vh, 0) rotate(300deg); }
  }

  .ecran {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    padding: calc(var(--u) * 5) 5vw; display: none; flex-direction: column;
  }
  .ecran.actif { display: flex; }

  /* ---------- Sundae ---------- */
  .miroir { display: inline-block; transform: scaleX(-1); }
  .sans-chat .miroir.mascotte { transform: none; }
  .trot { display: inline-block; animation: trot .4s ease-in-out infinite alternate; }
  @keyframes trot { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(calc(var(--u) * -1.2)) rotate(3deg); } }
  .sundae-dodo { position: relative; display: inline-block; font-size: calc(var(--u) * 12); margin-top: calc(var(--u) * 3); }
  .sundae-dodo .corps { display: inline-block; animation: respire 3s ease-in-out infinite; transform-origin: bottom; }
  @keyframes respire { 50% { transform: scaleY(.92) scaleX(1.03); } }
  .zzz {
    position: absolute; right: calc(var(--u) * -5); top: calc(var(--u) * -4); font-size: calc(var(--u) * 5);
    animation: zzz 3s ease-in infinite; opacity: 0;
  }
  @keyframes zzz { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(var(--u) * 4), calc(var(--u) * -8)) scale(1.2); } }
  .sans-chat .sundae-dodo, .sans-chat .sundae-saut { display: none; }
  .sundae-saut {
    position: absolute; bottom: calc(var(--u) * 6); font-size: calc(var(--u) * 14);
    animation: saut .9s cubic-bezier(.3,0,.6,1) infinite;
  }
  .sundae-saut.gauche { left: 6vw; }
  .sundae-saut.droite { right: 6vw; animation-delay: .45s; }
  @keyframes saut { 0%, 100% { transform: translateY(0) scaleY(.9); } 45% { transform: translateY(calc(var(--u) * -14)) scaleY(1.05); } }

  /* ---------- Barre du haut ---------- */
  .barre { display: flex; justify-content: space-between; align-items: center; gap: 2vw; }
  .horloge { font-size: calc(var(--u) * 8); font-weight: 700; }
  .bus {
    font-size: calc(var(--u) * 5); font-weight: 600; background: rgba(255,255,255,.12);
    padding: calc(var(--u) * 1.2) calc(var(--u) * 3); border-radius: 99px; white-space: nowrap;
  }
  .bus b { font-size: calc(var(--u) * 6); }
  .compteurs {
    display: flex; gap: calc(var(--u) * 1.5); border: none; background: none; color: inherit;
  }
  .compteur {
    font-size: calc(var(--u) * 4.2); font-weight: 600; white-space: nowrap;
    background: rgba(255,255,255,.1); border: calc(var(--u) * .5) solid var(--f);
    padding: calc(var(--u) * .8) calc(var(--u) * 2.2); border-radius: 99px;
  }
  .compteur .n { color: var(--or); font-weight: 700; }
  .compteur.bocal { --f: var(--or); }
  .compteur.bocal.pleine { animation: battement 1s ease-in-out infinite; background: rgba(255,217,61,.25); }

  /* ---------- Étape en cours ---------- */
  .scene { flex: 1; display: flex; align-items: center; gap: 4vw; min-height: 0; }
  .zone-anneau { position: relative; width: calc(var(--u) * 78); height: calc(var(--u) * 60); flex-shrink: 0; }
  #sceneCanvas {
    position: absolute; left: 50%; top: calc(var(--u) * 25);
    width: calc(var(--u) * 100); height: calc(var(--u) * 100);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .anneau { position: absolute; left: calc(var(--u) * 14); top: 0; width: calc(var(--u) * 50); height: calc(var(--u) * 50); }

  /* ---------- Avatars de Lou et Alba ---------- */
  .duo {
    position: absolute; left: calc(var(--u) * -2); right: calc(var(--u) * -2); bottom: calc(var(--u) * -3);
    display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
  }
  .avatar { width: calc(var(--u) * 21); text-align: center; }
  .avatar svg { display: block; width: 100%; height: calc(var(--u) * 31.5); overflow: visible; transform-origin: 50% 100%; animation: souffle 2.6s ease-in-out infinite; }
  .avatar:nth-child(2) svg { animation-delay: -1.3s; }
  .duo.fort .avatar svg { animation: sautille .55s ease-in-out infinite alternate; }
  .duo.fort .avatar:nth-child(2) svg { animation-delay: -.27s; }
  .avatar .prenom {
    display: inline-block; margin-top: calc(var(--u) * -.5); font-size: calc(var(--u) * 3.4); font-weight: 700;
    color: var(--f); background: rgba(20,24,51,.75); padding: 0 calc(var(--u) * 1.6); border-radius: 99px;
  }
  @keyframes souffle { 50% { transform: scaleY(1.02) translateY(calc(var(--u) * -.3)); } }
  @keyframes sautille { from { transform: translateY(0) scaleY(.98); } to { transform: translateY(calc(var(--u) * -2.2)) scaleY(1.02); } }
  .avatar-svg .frotte { animation: frotte .25s ease-in-out infinite alternate; }
  @keyframes frotte { from { transform: translateX(-2px); } to { transform: translateX(3px); } }
  .avatar-svg .coiffe { animation: coiffe .9s ease-in-out infinite alternate; }
  @keyframes coiffe { from { transform: translateY(-3px); } to { transform: translateY(6px); } }
  .avatar-svg .coucou { transform-box: fill-box; transform-origin: 0% 100%; animation: coucou .6s ease-in-out infinite alternate; }
  @keyframes coucou { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }
  .avatar-svg .flotte { animation: flotte 2s ease-in-out infinite alternate; }
  @keyframes flotte { from { transform: translate(-2px, 0); } to { transform: translate(3px, -5px); } }
  .avatar-svg .zzz-avatar { animation: flotte 1.6s ease-in-out infinite alternate; }
  .avatar-svg .couette, .avatar-svg .queue { transform-box: fill-box; transform-origin: 50% 0%; animation: balance 1.8s ease-in-out infinite alternate; }
  @keyframes balance { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .anneau svg { width: 100%; height: 100%; }
  .anneau .fond { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.14); stroke-width: 18; }
  .anneau .reste {
    fill: none; stroke: var(--c); stroke-width: 18; stroke-linecap: round;
    transition: stroke-dashoffset .3s linear, stroke 1.5s;
  }
  .emoji-centre {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 25);
  }
  .anneau.urgent { animation: battement 1s ease-in-out infinite; }
  @keyframes battement { 50% { transform: scale(1.05); } }

  .texte { min-width: 0; }
  .etape-num { font-size: calc(var(--u) * 4); opacity: .7; font-weight: 500; }
  .texte h1 { font-size: calc(var(--u) * 9.5); line-height: 1.05; margin: calc(var(--u) * 1) 0 calc(var(--u) * 3); }
  .details { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 2); margin-bottom: calc(var(--u) * 3); }
  .puce {
    font-size: calc(var(--u) * 4.5); font-weight: 600; background: rgba(255,255,255,.12);
    border: calc(var(--u) * .5) solid var(--c); padding: calc(var(--u) * 1) calc(var(--u) * 2.5); border-radius: 99px;
  }
  .puce.rappel { border-color: var(--or); background: rgba(255,217,61,.15); }
  .restant { font-size: calc(var(--u) * 6); font-weight: 500; }
  .restant b { font-size: calc(var(--u) * 10); color: var(--c); }
  .rappels-ligne { font-size: calc(var(--u) * 3.8); margin-top: calc(var(--u) * 3); color: var(--or); font-weight: 600; }

  /* ---------- La route ---------- */
  .route { display: flex; align-items: flex-end; gap: 2vw; height: calc(var(--u) * 19); }
  .piste-zone { position: relative; flex: 1; height: 100%; }
  .piste { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .6vw; }
  .seg { flex-basis: 0; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .seg-emoji { font-size: calc(var(--u) * 5); height: calc(var(--u) * 7); position: relative; }
  .seg-barre { width: 100%; height: calc(var(--u) * 3.2); border-radius: 99px; }
  .seg.fait { opacity: .35; }
  .seg.fait .seg-emoji::after {
    content: "✓"; position: absolute; right: calc(var(--u) * -2.2); top: calc(var(--u) * -1);
    font-size: calc(var(--u) * 4); font-weight: 700; color: #7CFFB2;
  }
  .seg.encours .seg-emoji { font-size: calc(var(--u) * 6.5); }
  .seg.encours .seg-barre { box-shadow: 0 0 calc(var(--u) * 2.5) var(--c); }
  .perso {
    position: absolute; bottom: calc(var(--u) * 3.6); font-size: calc(var(--u) * 7); transform: translateX(-50%);
    transition: left .3s linear; white-space: nowrap;
  }
  .arret { font-size: calc(var(--u) * 9); line-height: 1; }

  /* ---------- Écrans calmes ---------- */
  .calme { justify-content: center; align-items: center; text-align: center; }
  .calme .grand { font-size: calc(var(--u) * 26); line-height: 1.1; }
  .calme h2 { font-size: calc(var(--u) * 10); margin-top: calc(var(--u) * 2); }
  .calme p { font-size: calc(var(--u) * 5.5); opacity: .8; margin-top: calc(var(--u) * 2); }
  .calme .horloge { position: absolute; top: calc(var(--u) * 5); left: 5vw; }
  .calme .compteurs { position: absolute; top: calc(var(--u) * 6); right: 5vw; }
  .calme p.bocal-ligne { color: var(--or); opacity: 1; font-size: calc(var(--u) * 4.5); }
  .etoile-ciel { position: absolute; width: calc(var(--u) * .8); height: calc(var(--u) * .8); border-radius: 50%; background: #fff; animation: scintille 3s ease-in-out infinite; }
  @keyframes scintille { 50% { opacity: .15; } }
  .bus-roule { display: inline-block; animation: roule 7s linear infinite; white-space: nowrap; }
  @keyframes roule { from { transform: translateX(-80vw); } to { transform: translateX(80vw); } }

  /* ---------- Annonce de changement d'étape ---------- */
  #annonce {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20,24,51,.92); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .5s;
  }
  #annonce.visible { opacity: 1; }
  #annonce .annonce-emoji { font-size: calc(var(--u) * 38); line-height: 1.1; }
  #annonce.visible .annonce-emoji { animation: pop .9s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.2) rotate(-20deg); } to { transform: scale(1) rotate(0); } }
  #annonce .annonce-sur { font-size: calc(var(--u) * 6); color: var(--c); font-weight: 600; }
  #annonce .annonce-titre { font-size: calc(var(--u) * 12); font-weight: 700; }

  /* ---------- Les étoiles ---------- */
  #notes {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 15;
    display: none; align-items: center; justify-content: center;
    background: rgba(20,24,51,.97); text-align: center;
  }
  #notes.visible { display: flex; }
  .notes-titre { font-size: calc(var(--u) * 9); font-weight: 700; }
  .notes-bus { font-size: calc(var(--u) * 4.5); opacity: .75; margin: calc(var(--u) * 1) 0 calc(var(--u) * 4); }
  .ligne-fille {
    display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 4);
    margin-bottom: calc(var(--u) * 3);
  }
  .ligne-fille .nom {
    width: calc(var(--u) * 30); text-align: right; font-size: calc(var(--u) * 9); font-weight: 700; color: var(--f);
  }
  .etoiles { display: flex; gap: calc(var(--u) * 1.5); }
  .etoile-btn {
    background: none; border: none; line-height: 1;
    font-size: calc(var(--u) * 15); color: rgba(255,255,255,.18); transition: color .2s, transform .2s;
  }
  .etoile-btn.pleine { color: var(--or); text-shadow: 0 0 calc(var(--u) * 3) rgba(255,217,61,.6); transform: scale(1.08); }
  .notes-actions { display: flex; gap: calc(var(--u) * 3); justify-content: center; margin-top: calc(var(--u) * 3); }
  .btn {
    font-size: calc(var(--u) * 5.5); font-weight: 700; border: none; border-radius: 99px;
    padding: calc(var(--u) * 2) calc(var(--u) * 6);
  }
  .btn-principal { background: var(--or); color: var(--nuit); }
  .btn-principal:disabled { opacity: .3; }
  .btn-secondaire { background: rgba(255,255,255,.12); color: #fff; }
  #bravo { display: none; }
  .bravo-contenu { display: flex; align-items: center; gap: 6vw; }
  .bravo-titre { font-size: calc(var(--u) * 11); font-weight: 700; margin-bottom: calc(var(--u) * 3); }
  .bravo-filles { display: flex; gap: 5vw; }
  .avatar-bravo svg { width: calc(var(--u) * 22); height: calc(var(--u) * 33); overflow: visible; animation: sautille .5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .bravo-fille { margin-bottom: calc(var(--u) * 3); animation: pop .9s cubic-bezier(.2,1.6,.4,1) backwards; }
  .bravo-fille + .bravo-fille { animation-delay: .4s; }
  .bravo-fille .nom { font-size: calc(var(--u) * 8); font-weight: 700; color: var(--f); }
  .bravo-fille .gagne { font-size: calc(var(--u) * 10); color: var(--or); letter-spacing: .1em; line-height: 1.1; }
  .bravo-fille .total { font-size: calc(var(--u) * 4.5); opacity: .85; }
  .bocal { width: calc(var(--u) * 30); text-align: center; }
  .bocal svg { width: calc(var(--u) * 26); height: calc(var(--u) * 31); overflow: visible; }
  .bocal .niveau {
    transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0);
    transition: transform 1.6s cubic-bezier(.3,.7,.3,1);
  }
  .bocal .texte-bocal { font-size: calc(var(--u) * 4.2); font-weight: 600; margin-top: calc(var(--u) * 1.5); }
  .bocal .chiffre { font-size: calc(var(--u) * 7); font-weight: 700; color: var(--or); }
  .bocal.pleine svg { animation: battement .8s ease-in-out 1.6s infinite; }

  /* ---------- Démarrage ---------- */
  #demarrer {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20,24,51,.9); text-align: center; padding: 0 5vw;
  }
  #demarrer h2 { font-size: calc(var(--u) * 9); }
  #demarrer p { font-size: calc(var(--u) * 5); opacity: .8; margin: calc(var(--u) * 2) 0 calc(var(--u) * 5); }
  .choix-parent { display: flex; gap: calc(var(--u) * 4); }
  .etat-sync { font-size: calc(var(--u) * 3); opacity: .6; margin-top: calc(var(--u) * 6); }
  #modeTest {
    position: fixed; bottom: calc(var(--u) * 1); right: 1vw; z-index: 30; font-size: calc(var(--u) * 2.2);
    background: #EE5A52; padding: calc(var(--u) * .5) calc(var(--u) * 1.5); border-radius: 99px; display: none;
  }
</style>
</head>
<body>
<div id="halo"></div>
<div id="decor"></div>

<!-- Pendant une routine -->
<section id="routine" class="ecran">
  <div class="barre">
    <div class="horloge">7h25</div>
    <button class="compteurs" aria-label="Donner les étoiles"></button>
    <div class="bus"><span id="finEmoji">🚌</span> dans <b id="busMin">43</b> min</div>
  </div>
  <div class="scene">
    <div class="zone-anneau">
      <canvas id="sceneCanvas"></canvas>
      <div class="anneau" id="anneau">
        <svg viewBox="0 0 200 200">
          <circle class="fond" cx="100" cy="100" r="88"></circle>
          <circle class="reste" id="arc" cx="100" cy="100" r="88" transform="rotate(-90 100 100)"></circle>
        </svg>
        <div class="emoji-centre" id="emojiTache"></div>
      </div>
      <div class="duo" id="duo"></div>
    </div>
    <div class="texte">
      <div class="etape-num" id="etapeNum"></div>
      <h1 id="titreTache"></h1>
      <div class="details" id="details"></div>
      <div class="restant" id="restant"></div>
      <div class="rappels-ligne" id="rappelsLigne"></div>
    </div>
  </div>
  <div class="route">
    <div class="piste-zone">
      <div class="piste" id="piste"></div>
      <div class="perso" id="perso"><span class="trot"><span class="miroir mascotte">🐈</span></span></div>
    </div>
    <div class="arret" id="arret">🚏</div>
  </div>
</section>

<!-- Avant la routine du matin -->
<section id="dodo" class="ecran calme">
  <div class="horloge">7h00</div>
  <div class="grand">🌙</div>
  <h2 id="dodoTitre">Chut… tout le monde dort</h2>
  <p id="dodoReste"></p>
  <div class="sundae-dodo"><span class="corps miroir mascotte">🐈</span><span class="zzz">💤</span></div>
</section>

<!-- Avant une routine de la journée -->
<section id="attente" class="ecran calme">
  <div class="horloge">19h00</div>
  <button class="compteurs" aria-label="Donner les étoiles"></button>
  <div class="grand" id="attenteEmoji">🌙</div>
  <h2 id="attenteTitre"></h2>
  <p id="attenteTexte"></p>
</section>

<!-- Après une routine -->
<section id="fin" class="ecran calme">
  <div class="horloge">8h08</div>
  <button class="compteurs" aria-label="Donner les étoiles"></button>
  <div class="grand"><span class="bus-roule"><span class="miroir"><span id="finAnim">🚌</span> <span class="trot"><span class="mascotte">🐈</span></span></span></span></div>
  <h2 id="finMessage">Bonne journée les filles !</h2>
  <p id="finSous">❤️ À ce soir</p>
  <p class="bocal-ligne" id="finBocal"></p>
</section>

<!-- Rien aujourd'hui -->
<section id="repos" class="ecran calme">
  <div class="horloge">9h00</div>
  <button class="compteurs" aria-label="Donner les étoiles"></button>
  <div class="grand" id="reposEmoji">🎉</div>
  <h2 id="reposTitre">Pas d'école aujourd'hui</h2>
  <p id="reposTexte">Profitez bien !</p>
  <p class="bocal-ligne" id="reposBocal"></p>
</section>

<div id="annonce">
  <div class="annonce-emoji" id="annonceEmoji"></div>
  <div class="annonce-sur">C'est l'heure !</div>
  <div class="annonce-titre" id="annonceTitre"></div>
</div>

<div id="notes">
  <div id="notesBoite">
    <div class="notes-titre" id="notesTitre">⭐ Les étoiles du matin</div>
    <div class="notes-bus" id="notesBus"></div>
    <div id="notesFilles"></div>
    <div class="notes-actions">
      <button class="btn btn-secondaire" id="notesPlusTard">Plus tard</button>
      <button class="btn btn-principal" id="notesValider" disabled>Valider</button>
    </div>
  </div>
  <div id="bravo"></div>
</div>

<div id="demarrer">
  <h2>☀️ Le matin de Lou et Alba</h2>
  <p>Qui est là aujourd'hui ?</p>
  <div class="choix-parent">
    <button class="btn btn-principal" data-parent="Papa">👨 Papa</button>
    <button class="btn btn-principal" data-parent="Maman">👩 Maman</button>
  </div>
  <div class="etat-sync" id="etatSync"></div>
</div>

<div id="modeTest">MODE TEST</div>

<script src="commun.js"></script>
<script>
(function () {
  "use strict";

  // Les routines (horaires, étapes, voix) se modifient dans l'espace parent, onglet Routines.

  //        auto=1 pour sauter l'écran de démarrage, parent=Maman.
  //        En mode test, rien n'est enregistré.
  // =====================================================================
  var q = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;

  var SIM = null;
  if (q.heure) {

    base.setHours(+hp[0], +hp[1], +(hp[2] || 0), 0);

    document.getElementById("modeTest").style.display = "block";
  }
  var VOIX_ACTIVE = q.voix !== "0";
  var FILLES = MATIN.FILLES;
  var stock = MATIN.creerStock({ test: !!SIM });
  var PARENT = "Papa";

  function $(id) { return document.getElementById(id); }
  var pad = MATIN.pad, cleJour = MATIN.cleJour, sec = MATIN.sec, esc = MATIN.esc;
  function maintenant() {
    return SIM ? new Date(SIM.debut + (Date.now() - SIM.reel) * SIM.vitesse) : new Date();
  }
  function pluriel(n, mot) { return n + " " + mot + (n > 1 ? "s" : ""); }
  function perso(t) { return (t || "").replace(/\{parent\}/g, PARENT); }
  function heureLisible(hhmm) { return String(hhmm).replace(/^0/, "").replace(":", "h"); }
  function dansMinutes(secondes) {
    var m = Math.ceil(secondes / 60);
    return m >= 60 ? Math.floor(m / 60) + " h " + (m % 60 ? pad(m % 60) : "") : m + " min";
  }

  var C = 2 * Math.PI * 88;
  $("arc").style.strokeDasharray = C;

  // ---------- Programme du jour et réglages (recalculés quand les données changent) ----------
  var progCle = null, prog = null;
  function programmeDuJour(d) {
    var cle = cleJour(d) + "|" + stock.version() + "|" + Math.floor(Date.now() / 60000);
    if (cle !== progCle) {
      progCle = cle;
      prog = MATIN.programme(stock, d, { forcer: q.ecole === "1" || !!q.routine, routine: q.routine });
      prog.routines.forEach(function (x) { x.sig = JSON.stringify(x.r); });
    }
    return prog;
  }
  var decorCle = null, decor = { particules: [], fete: null }, regl = MATIN.reglages(stock);
  function majReglages(d) {
    regl = MATIN.reglages(stock);
    decor = MATIN.decorDuJour(d, regl);
    document.body.classList.toggle("sans-chat", !regl.mascotte);
    var masc = document.querySelectorAll(".mascotte");
    for (var k = 0; k < masc.length; k++) masc[k].textContent = regl.mascotte || "👧👧";
    var cle = decor.particules.join("");
    if (cle !== decorCle) { decorCle = cle; construireDecor(decor.particules); }
    if (etatCourant) afficherDecor(etatCourant.split(":")[0]);
  }
  function construireDecor(liste) {
    var html = "";
    if (liste.length) {
      for (var n = 0; n < 16; n++) {
        var taille = 3 + Math.random() * 3.5;
        html += '<span class="particule" style="left:' + (Math.random() * 96) + '%;font-size:calc(var(--u) * ' + taille.toFixed(1) +
                ');opacity:' + (0.35 + Math.random() * 0.3).toFixed(2) + ';animation-duration:' + (11 + Math.random() * 9).toFixed(1) +
                's;animation-delay:-' + (Math.random() * 20).toFixed(1) + 's">' + liste[n % liste.length] + '</span>';
      }
    }
    $("decor").innerHTML = html;
  }

  function majCompteurs() {
    var html = FILLES.map(function (f) {
      return '<span class="compteur" style="--f:' + f.couleur + '">' + f.nom +
             ' <span class="n">⭐ ' + MATIN.total(stock, f.nom) + '</span></span>';
    }).join("");
    var c = MATIN.cagnotte(stock);
    if (c) {
      html += '<span class="compteur bocal' + (c.pleine ? " pleine" : "") + '">' + (c.pleine ? "🎉" : "🫙") +
              ' <span class="n">' + Math.min(c.progres, c.objectif) + "/" + c.objectif + '</span></span>';
    }
    var blocs = document.querySelectorAll(".compteurs");
    for (var k = 0; k < blocs.length; k++) blocs[k].innerHTML = html;
    var texte = !c ? "" : c.pleine ? "🎉 Le bocal est plein : " + c.recompense
      : "🫙 Encore " + pluriel(c.objectif - c.progres, "étoile") + " pour " + c.recompense;
    $("finBocal").textContent = texte;
    $("reposBocal").textContent = texte;
  }

  // ---------- Son (généré, aucun fichier) ----------
  var audio = null;
  function note(freq, t0, dur, vol) {
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  var SONS = {
    etape:   [[523, 0], [659, .15], [784, .3], [1047, .45, .8]],
    alerte:  [[880, 0, .25], [880, .35, .25]],
    bus:     [[784, 0], [659, .2], [784, .4], [1047, .6], [1319, .8, 1]],
    etoile:  [[1319, 0, .15]],
    fanfare: [[523, 0, .2], [523, .2, .2], [523, .4, .2], [659, .6, .5], [587, 1.1, .2], [659, 1.3, .2], [784, 1.5, 1.2]],
    bocal:   [[784, 0, .15], [988, .12, .15], [1175, .24, .15], [1568, .36, .9], [1319, 1.2, .2], [1568, 1.4, 1.2]]
  };
  function jouer(nom, decalage) {
    if (!audio) return;
    var t = audio.currentTime + 0.05 + (decalage || 0);
    SONS[nom].forEach(function (n) { note(n[0], t + n[1], n[2] || .4, .3); });
  }

  // ---------- Voix ----------
  function parler(txt, delai) {
    if (!VOIX_ACTIVE || !demarre || !window.speechSynthesis || !txt) return;
    setTimeout(function () {
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = "fr-FR"; u.rate = .95; u.pitch = 1.1;
      var v = speechSynthesis.getVoices().filter(function (x) { return /^fr/i.test(x.lang); })[0];
      if (v) u.voice = v;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }, delai === undefined ? 1100 : delai);
  }

  // =====================================================================
  // Scènes animées par étape (même dessin que l'app Apple TV).
  // Elles jouent en grand aux temps forts (juste après l'annonce, dernière minute)
  // et restent discrètes le reste du temps.
  // =====================================================================
  var Scene = (function () {
    var type = null, debutEtape = 0, reste = 999, force = 0.25, actif = false;
    var cv = $("sceneCanvas"), ctx = cv.getContext("2d");
    var POLICE = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    var COULEURS = ["#FF6B9D", "#54A0FF", "#FFD93D", "#10AC84", "#A55EEA", "#FF9F43"];

    function emo(e, x, y, taille, o, rot, ech) {
      if (o === undefined) o = 1;
      if (o <= 0.01) return;

      ctx.globalAlpha = o;
      ctx.translate(x, y);
      if (rot) ctx.rotate(rot * Math.PI / 180);
      if (ech && ech !== 1) ctx.scale(ech, ech);
      ctx.font = Math.round(taille) + "px " + POLICE;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(e, 0, 0);
      ctx.restore();
    }
    function rond(x, y, s, remplissage, trait, epaisseur) {
      ctx.beginPath();
      ctx.arc(x, y, s / 2, 0, Math.PI * 2);
      if (remplissage) { ctx.fillStyle = remplissage; ctx.fill(); }
      if (trait) { ctx.strokeStyle = trait; ctx.lineWidth = epaisseur; ctx.stroke(); }
    }

    // c = centre, r = rayon de l'anneau, k = échelle (dessins pensés pour 1000 px)
    var dessins = {
      reveil: function (cx, cy, r, t, f, k) {
        ctx.save();
        ctx.globalAlpha = 0.25 + 0.55 * f;
        ctx.strokeStyle = "#FFD93D"; ctx.lineWidth = 14 * k; ctx.lineCap = "round";
        for (var i = 0; i < 14; i++) {
          var a = (t * 12 + i * 360 / 14) * Math.PI / 180, l = r * (0.22 + 0.12 * Math.sin(t * 2.5 + i));
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * r * 1.14, cy + Math.sin(a) * r * 1.14);
          ctx.lineTo(cx + Math.cos(a) * (r * 1.14 + l), cy + Math.sin(a) * (r * 1.14 + l));
          ctx.stroke();
        }
        ctx.restore();
        var coeurs = ["💛", "❤️", "🧡"];
        for (var j = 0; j < nb(7, f); j++) {
          var p = cycle(t, 3.5, alea(j, 1));
          emo(coeurs[j % 3], cx + (alea(j, 2) - 0.5) * r * 1.4 + Math.sin(p * 6 + j) * 25 * k, cy - p * r * 1.8, (46 + p * 22) * k, fondu(p));
        }
      },
      repas: function (cx, cy, r, t, f, k) {
        for (var i = 0; i < nb(9, f); i++) {
          var p = cycle(t, 3.4, alea(i, 1)), s = (40 + p * 90) * k;
          ctx.save();
          ctx.globalAlpha = fondu(p) * 0.28;
          ctx.fillStyle = "#FFFFFF";
          ctx.beginPath();
          ctx.ellipse(cx + (alea(i, 2) - 0.5) * r * 0.7 + Math.sin(p * 6 + i) * 22 * k, cy - r * 0.25 - p * r * 1.5, s / 2, s * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        var aliments = ["🥐", "🍓", "🥛", "🍞", "🍌", "🧃"];
        for (var j = 0; j < nb(5, f); j++) {
          var q = cycle(t, 4.2, alea(j, 3)), sens = alea(j, 4) < 0.5 ? -1 : 1, portee = r * (0.9 + alea(j, 5) * 0.7);
          emo(aliments[j % aliments.length], cx + sens * q * portee, cy - r * 0.15 - 3.6 * r * q * (1 - q) + q * r * 0.6, 64 * k, fondu(q), sens * q * 300);
        }
      },
      habits: function (cx, cy, r, t, f, k) {
        var v = ["👕", "👗", "🧦", "👖", "🧢", "🧥"];
        for (var i = 0; i < nb(6, f); i++) {
          var p = cycle(t, 3.6, alea(i, 1)), a = alea(i, 2) * Math.PI * 2;
          var dx = cx + Math.cos(a) * r * 1.9, dy = cy + Math.sin(a) * r * 1.9;
          var e = p * p * (3 - 2 * p), courbe = Math.sin(p * Math.PI) * r * 0.5;
          var o = Math.min(1, p / 0.1) * (p > 0.8 ? (1 - p) / 0.2 : 1);
          emo(v[i % v.length], dx + (cx - dx) * e - Math.sin(a) * courbe, dy + (cy - dy) * e + Math.cos(a) * courbe, 76 * k, o, (1 - p) * 360, 1 - p * 0.6);
        }
      },
      bulles: function (cx, cy, r, t, f, k, maxi, teinte) {
        for (var i = 0; i < nb(maxi, f); i++) {
          var p = cycle(t, 3 + alea(i, 1) * 2, alea(i, 2));
          var x = cx + (alea(i, 3) - 0.5) * r * 2.6 + Math.sin(p * 8 + i) * 18 * k, y = cy + r * 1.2 - p * r * 3;
          var s = (24 + alea(i, 4) * 40 + p * 20) * k, o = fondu(p);
          ctx.save();
          ctx.globalAlpha = 0.18 * o; rond(x, y, s, teinte);
          ctx.globalAlpha = 0.75 * o; rond(x, y, s, null, "#FFFFFF", 3 * k);
          ctx.globalAlpha = 0.8 * o;
          ctx.fillStyle = "#FFFFFF";
          ctx.beginPath(); ctx.ellipse(x - s * 0.15, y - s * 0.23, s * 0.1, s * 0.07, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      },
      etincelles: function (cx, cy, r, t, f, k, maxi) {
        for (var i = 0; i < nb(maxi, f); i++) {
          var periode = 1.8 + alea(i, 1), p = cycle(t, periode, alea(i, 2));
          var a = alea(i, 3) * Math.PI * 2 + Math.floor(t / periode + alea(i, 2)) * 1.3, d = r * (1.05 + alea(i, 4) * 0.6);
          var o = Math.sin(p * Math.PI);
          emo("✨", cx + Math.cos(a) * d, cy + Math.sin(a) * d, (34 + alea(i, 5) * 24) * k, o, 0, 0.6 + 0.4 * o);
        }
      },
      coiffure: function (cx, cy, r, t, f, k) {
        for (var i = 0; i < 3; i++) {
          var a = (t * 35 + i * 120) * Math.PI / 180;
          emo("🎀", cx + Math.cos(a) * r * 1.2, cy + Math.sin(a) * r * 1.2, 60 * k, 0.45 + 0.55 * f, Math.sin(t * 2 + i) * 15);
        }
        dessins.etincelles(cx, cy, r, t, f, k, 14);
      },
      rangement: function (cx, cy, r, t, f, k) {
        var j = ["🧸", "🧦", "🥣", "🚗", "🧩", "📚", "💡"];
        for (var i = 0; i < nb(6, f); i++) {
          var p = cycle(t, 2.8, alea(i, 1)), x0 = (alea(i, 2) - 0.5) * r * 1.6, haut = -r * 1.7, bas = r * 0.25, dx = 0, dy;
          if (p < 0.7) { var q = p / 0.7; dy = haut + (bas - haut) * q * q; dx = x0 * (1 - q); }
          else { dy = bas - Math.sin((p - 0.7) / 0.3 * Math.PI) * 30 * k; }
          var o = Math.min(1, p / 0.08) * (p > 0.85 ? (1 - p) / 0.15 : 1);
          emo(j[i % j.length], cx + dx, cy + dy, 64 * k, o, p < 0.7 ? p * 200 : 0, p > 0.7 ? 0.8 : 1);
        }
      },
      chaussures: function (cx, cy, r, t, f, k) {
        var q = cycle(t, 5, 0);
        for (var i = 0; i < 12; i++) {
          var apparition = i / 12 * 0.8;
          if (q < apparition) continue;
          var age = (q - apparition) * 5;
          emo("👣", cx - r * 1.6 + i * (r * 3.2 / 11), cy + r * 1.15 + (i % 2 === 0 ? -22 : 22) * k, 50 * k,
              Math.max(0, 1 - age / 2.5) * (0.4 + 0.6 * f), 90);
        }
        for (var n = 0; n < 2; n++) {
          var rebond = Math.abs(Math.sin(t * 4 + n * 1.6)) * 40 * k * f;
          emo("👟", cx + (n === 0 ? -1 : 1) * r * 1.25, cy - r * 0.9 - rebond, 70 * k, 0.4 + 0.6 * f);
        }
      },
      jeu: function (cx, cy, r, t, f, k) {
        for (var i = 0; i < nb(9, f); i++) {
          var p = cycle(t, 5 + alea(i, 1) * 2, alea(i, 2));
          var x = cx + (alea(i, 3) - 0.5) * r * 3.2 + Math.sin(p * 5 + i) * 30 * k, y = cy + r * 1.6 - p * r * 3.6;
          var w = 58 * k, h = 70 * k;
          ctx.save();

          ctx.beginPath(); ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.5)";
          ctx.beginPath(); ctx.ellipse(x - w * 0.14, y - h * 0.21, w * 0.11, h * 0.09, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();

      },
      bain: function (cx, cy, r, t, f, k) {

        emo("🦆", cx + Math.sin(t * 0.6) * r * 1.2, cy + r * 1.25 + Math.sin(t * 2.2) * 10 * k, 80 * k, 0.5 + 0.5 * f, Math.sin(t * 2.2) * 8);
      },
      pyjama: function (cx, cy, r, t, f, k) {
        var a = t * 0.35;
        emo("🌙", cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r * 1.3, 80 * k, 0.5 + 0.5 * f);
        for (var i = 0; i < nb(14, f); i++) {
          var p = cycle(t, 2.4 + alea(i, 1), alea(i, 2)), an = alea(i, 3) * Math.PI * 2, d = r * (1.1 + alea(i, 4) * 0.6);
          emo("⭐", cx + Math.cos(an) * d, cy + Math.sin(an) * d, (28 + alea(i, 5) * 20) * k, Math.sin(p * Math.PI) * 0.9);

      },
      histoire: function (cx, cy, r, t, f, k) {
        var m = ["✨", "🐉", "🧚", "🏰", "⭐", "🦄"];
        for (var i = 0; i < nb(7, f); i++) {
          var p = cycle(t, 4, alea(i, 1)), a = (-90 + (alea(i, 2) - 0.5) * 120) * Math.PI / 180, d = r * 0.2 + p * r * 1.6;
          emo(m[i % m.length], cx + Math.cos(a) * d, cy + Math.sin(a) * d, (40 + p * 34) * k, fondu(p), Math.sin(p * 6) * 15);

      }

    function image(ts) {
      if (!actif) return;

        cv.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      var cibleForce = ((depuis > 4.5 && depuis < 16) || reste <= 60) ? 1 : 0.25;
      force += (cibleForce - force) * 0.04;
      $("duo").classList.toggle("fort", cibleForce === 1);

      etape: function (nouveauType) { type = nouveauType; debutEtape = performance.now(); },
      reste: function (s) { reste = s; },

  // ---------- Affichage d'une routine ----------
  var etatCourant = null, cible = null, cleEtape = null, pisteSig = null, idxCourant = 0;
  var alerteFaite = false, demarre = false, timerAnnonce = null;

  function montrerEcran(nom) {
    ["routine", "dodo", "attente", "fin", "repos"].forEach(function (id) {
      $(id).classList.toggle("actif", id === nom);
    });
    $("halo").style.display = nom === "routine" ? "block" : "none";
    afficherDecor(nom);
    if (nom === "routine") Scene.demarrer(); else Scene.arreter();
  }

  // Saisons seulement hors routine ; ballons d'anniversaire partout
  function afficherDecor(nom) {
    $("decor").style.display = (nom !== "routine" || decor.fete) ? "block" : "none";
  }

  function dessinerAvatars(r, i) {
    var etat = MATIN.etatAvatar(r, i);
    $("duo").innerHTML = FILLES.map(function (f) {
      return '<div class="avatar" style="--f:' + f.couleur + '">' + MATIN.avatarSVG(f.nom, regl.avatars[f.nom], etat) +
             '<div class="prenom">' + f.nom + '</div></div>';
    }).join("");
  }

  function construirePiste(r) {
    $("piste").innerHTML = r.etapes.map(function (e) {
      return '<div class="seg" style="flex-grow:' + (e.f - e.d) + '"><div class="seg-emoji">' + esc(e.emoji) + '</div>' +
             '<div class="seg-barre" style="background:' + esc(e.couleur) + '"></div></div>';
    }).join("");
    $("arret").textContent = r.finEmoji || "🏁";
    $("finEmoji").textContent = r.finEmoji || "🏁";
  }

  function afficherEtape(r, i) {
    var e = r.etapes[i];
    var rappels = MATIN.rappelsDuJour(stock, maintenant());
    document.documentElement.style.setProperty("--c", e.couleur);
    $("halo").style.backgroundColor = e.couleur;
    $("emojiTache").textContent = e.emoji;
    $("titreTache").textContent = perso(e.titre);
    $("etapeNum").textContent = "Étape " + (i + 1) + " sur " + r.etapes.length;
    var puces = e.details.map(function (t) { return '<span class="puce">' + esc(t) + '</span>'; });
    if (e.rappels === "complet") {
      rappels.forEach(function (t) { puces.push('<span class="puce rappel">📌 ' + esc(t) + '</span>'); });
    }
    $("details").innerHTML = puces.join("");
    $("rappelsLigne").textContent = (e.rappels !== "complet" && rappels.length)
      ? "📌 Aujourd'hui : " + rappels.join(" · ") : "";
    var segs = $("piste").children;
    for (var k = 0; k < segs.length; k++) {
      segs[k].className = "seg" + (k < i ? " fait" : k === i ? " encours" : "");
    }
    dessinerAvatars(r, i);
  }

  function annoncer(r, i) {
    var e = r.etapes[i];
    $("annonceEmoji").textContent = e.emoji;
    $("annonceTitre").textContent = perso(e.titre);
    var a = $("annonce");
    a.classList.remove("visible"); void a.offsetWidth; a.classList.add("visible");
    clearTimeout(timerAnnonce);
    timerAnnonce = setTimeout(function () { a.classList.remove("visible"); }, 5000);
    jouer("etape");
    var phrase = perso(e.voix);
    if (i === 0 && decor.fete) {
      phrase = "Joyeux anniversaire " + decor.fete.nom + " ! " + decor.fete.age + " ans aujourd'hui ! " + phrase;
    }
    var rappels = MATIN.rappelsDuJour(stock, maintenant());
    if (e.rappels && rappels.length) {
      phrase += " Aujourd'hui, n'oubliez pas : " + rappels.map(MATIN.sansEmoji).join(", ") + ".";
    }
    parler(phrase);
  }

  function majRoutine(x, s) {
    var r = x.r, i = 0;
    for (var k = 0; k < r.etapes.length; k++) if (s >= r.etapes[k].d) i = k;
    var e = r.etapes[i];
    if (x.sig !== pisteSig) { pisteSig = x.sig; construirePiste(r); afficherEtape(r, i); }
    var cle = x.id + "|" + e.debut + "|" + e.titre;
    idxCourant = i;
    if (cle !== cleEtape) {
      cleEtape = cle;
      afficherEtape(r, i);
      Scene.etape(MATIN.sceneDe(e));
      alerteFaite = (e.f - s) <= 60;
      if (demarre) annoncer(r, i);
    }
    var dur = Math.max(1, e.f - e.d), reste = Math.max(0, e.f - s);
    Scene.reste(reste);
    $("arc").style.strokeDashoffset = C * (1 - reste / dur);
    $("restant").innerHTML = reste > 60
      ? "encore <b>" + Math.ceil(reste / 60) + "</b> min"
      : "encore <b>" + Math.ceil(reste) + "</b> secondes";
    $("anneau").classList.toggle("urgent", reste <= 60);
    if (demarre && !alerteFaite && reste <= 60 && dur >= 180) {
      alerteFaite = true;
      jouer("alerte");
      parler(perso(e.alerte) || "Plus qu'une minute !");
    }
    $("busMin").textContent = Math.ceil((r.finS - s) / 60);
    $("perso").style.left = ((s - r.debutS) / (r.finS - r.debutS) * 100) + "%";
  }

  // ---------- Les étoiles ----------
  var notesEnCours = {}, cleNotesOuvertes = null, autoOuvert = {}, timerBravo = null;
  var notesVues = null; // pour repérer une nouvelle note, donnée ici ou depuis un téléphone

  function routinePourNotes() {
    if (cible && cible.r.etoiles) return cible;
    var p = programmeDuJour(maintenant());
    for (var i = 0; i < p.routines.length; i++) if (p.routines[i].r.etoiles) return p.routines[i];
    return { id: "ecole", r: { nom: "École", etoiles: true } };
  }

  function ouvrirNotes(x) {
    x = x && x.r ? x : routinePourNotes();
    cleNotesOuvertes = MATIN.cleNote(cleJour(maintenant()), x.id);
    var deja = stock.lire("notes/" + cleNotesOuvertes) || {};
    notesEnCours = {};
    FILLES.forEach(function (f) { notesEnCours[f.nom] = deja[f.nom] || 0; });
    $("notesTitre").textContent = "⭐ Les étoiles " + (x.id === "ecole" ? "du matin" : "· " + x.r.nom);
    $("notesFilles").innerHTML = FILLES.map(function (f) {
      var btns = "";
      for (var n = 1; n <= 3; n++) {
        btns += '<button class="etoile-btn" data-nom="' + f.nom + '" data-n="' + n + '" aria-label="' + n + ' étoile">★</button>';
      }
      return '<div class="ligne-fille" style="--f:' + f.couleur + '"><div class="nom">' + f.nom +
             '</div><div class="etoiles">' + btns + '</div></div>';
    }).join("");
    $("notesBoite").style.display = "block";
    $("bravo").style.display = "none";
    majEtoiles();
    $("notes").classList.add("visible");
  }

  function majEtoiles() {
    var btns = document.querySelectorAll(".etoile-btn"), complet = true;
    for (var k = 0; k < btns.length; k++) {
      var b = btns[k];
      b.classList.toggle("pleine", +b.getAttribute("data-n") <= notesEnCours[b.getAttribute("data-nom")]);
    }
    FILLES.forEach(function (f) { if (!notesEnCours[f.nom]) complet = false; });
    $("notesValider").disabled = !complet;
  }

  function fermerNotes() {
    clearTimeout(timerBravo);
    $("notes").classList.remove("visible");
  }

  function validerNotes() {
    var valeur = {};
    FILLES.forEach(function (f) { valeur[f.nom] = notesEnCours[f.nom]; });
    // L'écriture déclenche verifierNouvellesNotes, qui affiche le bravo
    stock.ecrire("notes/" + cleNotesOuvertes, valeur).catch(function () {});
  }

  function somme(notes) {
    return FILLES.reduce(function (t, f) { return t + ((notes && notes[f.nom]) || 0); }, 0);
  }

  var BOCAL_FORME = "M22 34 Q12 40 12 54 V106 Q12 120 28 120 H72 Q88 120 88 106 V54 Q88 40 78 34 Z";

  function montrerBravo(notes, avant) {
    var gagne = somme(notes) - somme(avant);
    var c = MATIN.cagnotte(stock);
    var htmlBocal = "", bocalRempli = false;
    if (c) {
      var avantProgres = Math.max(0, c.progres - gagne);
      bocalRempli = avantProgres < c.objectif && c.pleine;
      htmlBocal = '<div class="bocal' + (c.pleine ? " pleine" : "") + '">' +
        '<svg viewBox="0 0 100 124"><defs><clipPath id="formeBocal"><path d="' + BOCAL_FORME + '"/></clipPath></defs>' +
        '<g clip-path="url(#formeBocal)"><rect class="niveau" id="niveauBocal" x="0" y="34" width="100" height="86" fill="#FFD93D"/></g>' +
        '<path d="' + BOCAL_FORME + '" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.85)" stroke-width="4"/>' +
        '<rect x="24" y="20" width="52" height="14" rx="4" fill="#C8A26B"/>' +
        '<text x="50" y="84" text-anchor="middle" font-size="26">' + (c.pleine ? "🎉" : "⭐") + '</text></svg>' +
        '<div class="chiffre">' + Math.min(c.progres, c.objectif) + ' / ' + c.objectif + '</div>' +
        '<div class="texte-bocal">' + (c.pleine ? "Le bocal est plein !<br>" + esc(c.recompense)
          : "Encore " + pluriel(c.objectif - c.progres, "étoile") + "<br>pour " + esc(c.recompense)) + '</div></div>';
      setTimeout(function () {
        var niv = $("niveauBocal");
        if (!niv) return;
        niv.style.transition = "none";
        niv.style.transform = "scaleY(" + Math.min(1, avantProgres / c.objectif) + ")";
        void niv.getBoundingClientRect();
        niv.style.transition = "";
        setTimeout(function () { niv.style.transform = "scaleY(" + Math.min(1, c.progres / c.objectif) + ")"; }, 400);
      }, 50);
    }
    $("bravo").innerHTML =
      '<div class="bravo-titre">Bravo les filles !</div>' +
      '<div class="bravo-contenu"><div class="bravo-filles">' + FILLES.map(function (f) {
        var n = notes[f.nom] || 0;
        var etat = MATIN.etatAvatar(cible && cible.r, cible ? cible.r.etapes.length - 1 : 0);
        etat.pose = "coucou"; etat.objet = ""; etat.expression = "rire";
        return '<div class="bravo-fille" style="--f:' + f.couleur + '">' +
               '<div class="avatar-bravo">' + MATIN.avatarSVG(f.nom, regl.avatars[f.nom], etat) + '</div>' +
               '<div class="nom">' + f.nom + '</div>' +
               '<div class="gagne">' + new Array(n + 1).join("★") + '</div>' +
               '<div class="total">Total : ' + MATIN.total(stock, f.nom) + ' ⭐</div></div>';
      }).join("") + '</div>' + htmlBocal + '</div>' +
      '<div class="sundae-saut gauche"><span class="mascotte">' + esc(regl.mascotte) + '</span></div>' +
      '<div class="sundae-saut droite"><span class="miroir mascotte">' + esc(regl.mascotte) + '</span></div>';
    $("notesBoite").style.display = "none";
    $("bravo").style.display = "block";
    $("notes").classList.add("visible");
    jouer("fanfare");
    var phrase = FILLES.filter(function (f) { return notes[f.nom]; }).map(function (f) {
      return "Bravo " + f.nom + ", " + pluriel(notes[f.nom], "étoile") + " !";
    }).join(" ");
    if (bocalRempli) {
      jouer("bocal", 3);
      phrase += " Et le bocal est plein ! " + MATIN.sansEmoji(c.recompense) + " !";
    }
    parler(phrase, 900);
    clearTimeout(timerBravo);
    timerBravo = setTimeout(fermerNotes, bocalRempli ? 14000 : 10000);
  }

  function notesAujourdhui() {
    var jour = cleJour(maintenant()), toutes = stock.lire("notes") || {}, map = {};
    for (var k in toutes) if (k.slice(0, 10) === jour) map[k] = JSON.stringify(toutes[k]);
    return { jour: jour, map: map };
  }
  function verifierNouvellesNotes() {
    if (!stock.synchronise()) return;
    var n = notesAujourdhui();
    if (!notesVues || notesVues.jour !== n.jour) { notesVues = n; return; }
    var change = null;
    for (var k in n.map) {
      if (n.map[k] !== notesVues.map[k]) change = { cle: k, avant: notesVues.map[k] ? JSON.parse(notesVues.map[k]) : {} };
    }
    notesVues = n;
    if (change && demarre) montrerBravo(JSON.parse(n.map[change.cle]), change.avant);
  }

  $("notesFilles").addEventListener("click", function (ev) {
    var b = ev.target.closest(".etoile-btn");
    if (!b) return;
    notesEnCours[b.getAttribute("data-nom")] = +b.getAttribute("data-n");
    jouer("etoile");
    majEtoiles();
  });
  $("notesValider").addEventListener("click", validerNotes);
  $("notesPlusTard").addEventListener("click", fermerNotes);
  $("bravo").addEventListener("click", fermerNotes);
  var blocsCompteurs = document.querySelectorAll(".compteurs");
  for (var k = 0; k < blocsCompteurs.length; k++) {
    blocsCompteurs[k].addEventListener("click", function () { ouvrirNotes(null); });
  }

  // Données modifiées (ici ou depuis l'espace parent)
  stock.surChangement(function () {
    majReglages(maintenant());
    majCompteurs();
    if (etatCourant && etatCourant.indexOf("routine:") === 0 && cible && pisteSig === cible.sig) {
      afficherEtape(cible.r, idxCourant);
    }
    verifierNouvellesNotes();
    majEtatSync();
  });

  function majEtatSync() {
    var e = stock.etat();
    $("etatSync").textContent = SIM ? "Mode test : rien n'est enregistré"
      : e === "en ligne" ? "⭐ Étoiles, rappels et routines synchronisés"
      : e === "connexion" ? "Connexion…"
      : e === "hors ligne" ? "Hors ligne : les étoiles seront envoyées au retour de la connexion"
      : "Mode local : étoiles enregistrées sur cet appareil seulement";
  }

  // ---------- Boucle principale ----------
  var jourReglages = null;
  function tick() {
    var d = maintenant();
    var s = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
    var jour = cleJour(d);
    if (jour !== jourReglages) { jourReglages = jour; majReglages(d); }
    var txt = d.getHours() + "h" + pad(d.getMinutes());
    var horloges = document.querySelectorAll(".horloge");
    for (var k = 0; k < horloges.length; k++) horloges[k].textContent = txt;

    // Quelle routine maintenant, laquelle vient de finir, laquelle arrive ?
    var p = programmeDuJour(d), courante = null, derniere = null, prochaine = null;
    p.routines.forEach(function (x) {
      if (s >= x.r.debutS && s < x.r.finS) courante = x;
      else if (s >= x.r.finS) { if (!derniere || x.r.finS > derniere.r.finS) derniere = x; }
      else if (!prochaine || x.r.debutS < prochaine.r.debutS) prochaine = x;
    });
    var etat, nouvelle = null;
    if (courante) { etat = "routine"; nouvelle = courante; }
    else if (prochaine && (prochaine.r.debutS - s <= 3600 || !derniere)) {
      etat = prochaine.r.debutS < 12 * 3600 ? "dodo" : "attente"; nouvelle = prochaine;
    }
    else if (derniere) { etat = "fin"; nouvelle = derniere; }
    else etat = "repos";

    var cleEtat = etat + ":" + (nouvelle ? nouvelle.id : "");
    if (cleEtat !== etatCourant) {
      if (etat === "fin" && etatCourant === "routine:" + nouvelle.id && demarre) {
        jouer("bus");
        parler(perso(nouvelle.r.finVoix));
      }
      if (etat !== "routine") { cleEtape = null; pisteSig = null; }
      etatCourant = cleEtat;
      montrerEcran(etat);
    }
    cible = nouvelle;
    var fete = decor.fete ? "🎂 Joyeux anniversaire " + decor.fete.nom + " !" : null;

    if (etat === "routine") majRoutine(cible, s);
    if (etat === "dodo") {
      var reste = cible.r.debutS - s;
      $("dodoTitre").textContent = fete || "Chut… tout le monde dort";
      $("dodoReste").textContent = reste <= 3600
        ? "Réveil dans " + Math.ceil(reste / 60) + " min"
        : "Réveil à " + heureLisible(cible.r.etapes[0].debut);
    }
    if (etat === "attente") {
      $("attenteEmoji").textContent = cible.r.emoji || "⏳";
      $("attenteTitre").textContent = fete || cible.r.nom + " à " + heureLisible(cible.r.etapes[0].debut);
      $("attenteTexte").textContent = (fete ? cible.r.nom + " " : "") + "dans " + dansMinutes(cible.r.debutS - s);
    }
    if (etat === "fin") {
      $("finAnim").textContent = cible.r.finEmoji || "🏁";
      $("finMessage").textContent = fete || perso(cible.r.finMessage) || "Bravo les filles !";
      $("finSous").textContent = perso(cible.r.finSous);
    }
    if (etat === "repos") {
      $("reposEmoji").textContent = fete ? "🎂" : "🎉";
      $("reposTitre").textContent = fete || "Pas d'école aujourd'hui";
      $("reposTexte").textContent = p.raison || "Profitez bien !";
    }

    // Ouverture automatique des étoiles, une fois par routine, si pas encore notées
    var xn = (etat === "routine" || etat === "fin") ? cible : null;
    if (demarre && xn && xn.r.etoiles && xn.r.heureNotes && stock.synchronise()) {
      var cleN = MATIN.cleNote(jour, xn.id);
      if (s >= sec(xn.r.heureNotes) && s < xn.r.finS + 3600 && !autoOuvert[cleN]) {
        autoOuvert[cleN] = true;
        if (!stock.lire("notes/" + cleN)) {
          ouvrirNotes(xn);
          jouer("etoile");
          parler(PARENT + ", c'est l'heure des étoiles !", 300);
        }
      }
    }
    $("notesBus").textContent = etat === "routine"
      ? (cible.r.finEmoji || "") + " " + (cible.r.finTitre || "Fin") + " dans " + Math.ceil((cible.r.finS - s) / 60) + " min" : "";
    if (notesVues && notesVues.jour !== jour) verifierNouvellesNotes();
  }

  // Étoiles du ciel de l'écran dodo
  for (var n = 0; n < 40; n++) {
    var et = document.createElement("div");
    et.className = "etoile-ciel";
    et.style.left = Math.random() * 100 + "%";
    et.style.top = Math.random() * 100 + "%";
    et.style.animationDelay = (Math.random() * 3) + "s";
    $("dodo").appendChild(et);
  }

  // ---------- Démarrage ----------
  function lancer(parent) {
    if (demarre) return;
    demarre = true;
    PARENT = parent || "Papa";
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { audio = new AC(); if (audio.resume) audio.resume(); }
    } catch (err) { audio = null; }
    // iPad : la voix doit parler une première fois pendant le toucher pour être débloquée
    if (VOIX_ACTIVE && window.speechSynthesis) {
      var u = new SpeechSynthesisUtterance("C'est parti !");
      u.lang = "fr-FR";
      speechSynthesis.speak(u);
    }
    $("demarrer").style.display = "none";
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (err) {}
    if (etatCourant && etatCourant.indexOf("routine:") === 0 && cible) {
      afficherEtape(cible.r, idxCourant);
      annoncer(cible.r, idxCourant);
    }
  }
  $("demarrer").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-parent]");
    if (b) lancer(b.getAttribute("data-parent"));
  });
  document.addEventListener("keydown", function (ev) { if (!demarre) { ev.preventDefault(); lancer("Papa"); } });
  if (window.speechSynthesis) speechSynthesis.getVoices();

  MATIN.Calendrier.charger();
  setInterval(MATIN.Calendrier.charger, 6 * 3600 * 1000);
  majReglages(maintenant());
  majCompteurs();
  majEtatSync();
  verifierNouvellesNotes();
  tick();
  setInterval(tick, 200);
  if (q.auto === "1") lancer(q.parent || "Papa");
})();
</script>
</body>
</html>
